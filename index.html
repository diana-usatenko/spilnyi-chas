</div>
<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script>
'use strict';
/* =========================================================================
 * Спільний час — прототип планувальника дзвінків
 *  • Організатор створює дзвінок (тема, тривалість, дати, години, дедлайн)
 *  • Учасники відкривають посилання і відмічають зручні слоти
 *    (можна «підтягнути» зайнятість з Google Calendar — у прототипі симуляція)
 *  • Після дедлайну організатор бачить топ-3 слоти й обирає один
 * Сайт (GitHub Pages) + сервер на Google Apps Script (дані в Google Таблиці).
 * Налаштування — у файлі config.js. Якщо API_URL порожній, працює демо-режим (localStorage).
 * ========================================================================= */

const STEP = 30;                 // крок сітки, хв
const TZ = 'Europe/Kyiv';        // часовий пояс дзвінків (прототип: один для всіх)

const CFG = Object.assign({ API_URL: '', GOOGLE_CLIENT_ID: '' }, window.SC_CONFIG || {});
const LIVE = !!CFG.API_URL;                         // є сервер Apps Script
const HAS_GCAL = !!CFG.GOOGLE_CLIENT_ID;            // справжнє підключення Google Calendar
const HASH_NAV = location.protocol === 'file:';     // відкрито як файл — навігація через #

/* ---------------- утиліти ---------------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = (n = 10) => { const a = new Uint8Array(n); crypto.getRandomValues(a); return Array.from(a, b => 'abcdefghijkmnpqrstuvwxyz23456789'[b % 32]).join(''); };
const pad = n => String(n).padStart(2, '0');
const hm = min => `${pad(Math.floor(min / 60))}:${pad(min % 60)}`;
const norm = s => String(s || '').trim().toLowerCase();
const dObj = d => new Date(d + 'T12:00:00Z');
const isoDate = dt => dt.toISOString().slice(0, 10);
const addDays = (d, n) => { const x = dObj(d); x.setUTCDate(x.getUTCDate() + n); return isoDate(x); };
const todayLocal = () => { const n = new Date(); return `${n.getFullYear()}-${pad(n.getMonth() + 1)}-${pad(n.getDate())}`; };
const fmtDay = d => new Intl.DateTimeFormat('uk-UA', { weekday: 'short', day: 'numeric', month: 'short', timeZone: 'UTC' }).format(dObj(d));
const fmtDayLong = d => new Intl.DateTimeFormat('uk-UA', { weekday: 'long', day: 'numeric', month: 'long', timeZone: 'UTC' }).format(dObj(d));
const fmtWeekday = d => new Intl.DateTimeFormat('uk-UA', { weekday: 'short', timeZone: 'UTC' }).format(dObj(d));
const fmtDateNum = d => new Intl.DateTimeFormat('uk-UA', { day: 'numeric', month: 'numeric', timeZone: 'UTC' }).format(dObj(d));
const fmtDeadline = ms => new Intl.DateTimeFormat('uk-UA', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }).format(new Date(ms));
const plural = (n, one, few, many) => { const a = n % 10, b = n % 100; return n + ' ' + (a === 1 && b !== 11 ? one : a >= 2 && a <= 4 && (b < 10 || b >= 20) ? few : many); };
function hashStr(s) { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(seed) { return () => { seed = (seed + 0x6D2B79F5) >>> 0; let t = seed; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), 2200); }
async function copyText(text, input) { try { await navigator.clipboard.writeText(text); toast('Скопійовано'); } catch { if (input) { input.focus(); input.select(); } toast('Виділено: скопіюйте вручну'); } }
/** Блокує кнопку на час дії й показує помилку, якщо щось пішло не так. */
async function busy(btn, fn) {
  const orig = btn.textContent;
  btn.disabled = true; btn.textContent = '…';
  try { await fn(); } catch (ex) { toast(ex.message); }
  finally { if (btn.isConnected) { btn.disabled = false; btn.textContent = orig; } }
}
/** Двоетапне підтвердження прямо на кнопці (без confirm()). Повертає true з другого натискання. */
function armed(btn, label) {
  if (btn.dataset.armed) return true;
  btn.dataset.armed = '1'; btn.dataset.orig = btn.textContent; btn.textContent = label;
  setTimeout(() => { if (btn.isConnected) { delete btn.dataset.armed; btn.textContent = btn.dataset.orig; } }, 4000);
  return false;
}
const safeLS = {
  get(k) { try { return localStorage.getItem(k); } catch { return safeLS.mem[k] ?? null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch { safeLS.mem[k] = v; } },
  mem: {}
};
/* ---------------- навігація ----------------
 * Стан у адресі: ?p=<id> (учасник), ?p=<id>&i=<запрошення>, ?a=<id>&t=<токен> (організатор). */
const qs = o => Object.keys(o).filter(k => o[k] !== undefined && o[k] !== '').map(k => encodeURIComponent(k) + '=' + encodeURIComponent(o[k])).join('&');
const parseQs = str => { const o = {}; new URLSearchParams(str).forEach((v, k) => o[k] = v); return o; };
const Nav = {
  params: {},
  _read() { return parseQs(HASH_NAV ? location.hash.slice(1) : location.search.slice(1)); },
  init() {
    this.params = this._read();
    window.addEventListener(HASH_NAV ? 'hashchange' : 'popstate', () => { this.params = this._read(); route(); });
  },
  go(params) {
    const q = qs(params);
    if (HASH_NAV) { if (location.hash.slice(1) === q) route(); else location.hash = q; return; }
    history.pushState(null, '', location.pathname + (q ? '?' + q : ''));
    this.params = params;
    window.scrollTo(0, 0);
    route();
  },
  link(params) {
    const q = qs(params);
    const base = location.href.split(/[?#]/)[0];
    return base + (q ? (HASH_NAV ? '#' : '?') + q : '');
  }
};
/** Посилання всередині застосунку: <a data-nav='{"p":"id"}'> */
const navAttrs = params => `href="${esc(Nav.link(params))}" data-nav="${esc(JSON.stringify(params))}"`;
document.addEventListener('click', e => {
  const a = e.target.closest && e.target.closest('a[data-nav]');
  if (!a || e.metaKey || e.ctrlKey || e.shiftKey) return;
  e.preventDefault();
  Nav.go(JSON.parse(a.dataset.nav || '{}'));
});
function waLink(text) { return 'https://wa.me/?text=' + encodeURIComponent(text); }

/* ---------------- модель ---------------- */
function pollDays(p) {
  if (Array.isArray(p.days) && p.days.length) return p.days.slice().sort();
  const out = [];
  for (let d = p.dateFrom; d <= p.dateTo; d = addDays(d, 1)) {
    const wd = dObj(d).getUTCDay();
    if (p.skipWeekends && (wd === 0 || wd === 6)) continue;
    out.push(d);
  }
  return out;
}
function pollTimes(p) { const out = []; for (let m = p.hourFrom * 60; m < p.hourTo * 60; m += STEP) out.push(m); return out; }
const cellKey = (d, m) => `${d}|${m}`;
const isClosed = p => !!p.closedAt || Date.now() >= p.deadline;

/** Рахує всі можливі старти та повертає топ-N слотів без перетинів. */
function rankSlots(poll, responses, topN = 3) {
  const need = Math.ceil(poll.duration / STEP);
  const sets = responses.map(r => ({ name: r.name, cells: new Set(r.cells) }));
  const cands = [];
  for (const d of pollDays(poll)) {
    for (let m = poll.hourFrom * 60; m + poll.duration <= poll.hourTo * 60; m += STEP) {
      const keys = Array.from({ length: need }, (_, i) => cellKey(d, m + i * STEP));
      const yes = [], no = [];
      for (const s of sets) (keys.every(k => s.cells.has(k)) ? yes : no).push(s.name);
      if (yes.length) cands.push({ date: d, start: m, end: m + poll.duration, yes, no });
    }
  }
  cands.sort((a, b) => b.yes.length - a.yes.length || (a.date < b.date ? -1 : a.date > b.date ? 1 : a.start - b.start));
  const picked = [];
  for (const c of cands) {
    if (picked.some(p => p.date === c.date && c.start < p.end && p.start < c.end)) continue;
    picked.push(c);
    if (picked.length >= topN) break;
  }
  return picked;
}

/** Імена очікуваних учасників, які ще не відповіли. */
function missingPeople(poll, responses) {
  const got = new Set(responses.map(r => norm(r.name)));
  return (poll.expected || []).filter(n => !got.has(norm(n)));
}

/** Симуляція Google Calendar: детерміновані «зайняті» блоки для імені. */
function fakeBusy(poll, name) {
  const r = rng(hashStr(norm(name) + poll.id));
  const busy = new Set();
  for (const d of pollDays(poll)) {
    const blocks = 1 + Math.floor(r() * 3);
    for (let b = 0; b < blocks; b++) {
      const len = 2 + Math.floor(r() * 4);
      const start = poll.hourFrom * 60 + Math.floor(r() * ((poll.hourTo - poll.hourFrom) * 2)) * STEP;
      for (let i = 0; i < len; i++) { const m = start + i * STEP; if (m < poll.hourTo * 60) busy.add(cellKey(d, m)); }
    }
  }
  return busy;
}

/* ---------------- Google Calendar ----------------
 * Вхід через Google Identity Services у браузері учасника. Доступ лише calendar.freebusy:
 * Google віддає проміжки «зайнято» без назв і змісту подій. Токен живе лише в пам'яті сторінки. */
const GCal = {
  _load: null, client: null, _res: null, _rej: null,
  load() {
    if (this._load) return this._load;
    this._load = new Promise((res, rej) => {
      const sc = document.createElement('script');
      sc.src = 'https://accounts.google.com/gsi/client'; sc.async = true;
      sc.onload = () => { this._init(); res(); };
      sc.onerror = () => { this._load = null; rej(new Error('Не вдалося завантажити вхід Google. Перевірте інтернет.')); };
      document.head.appendChild(sc);
    });
    return this._load;
  },
  _init() {
    this.client = google.accounts.oauth2.initTokenClient({
      client_id: CFG.GOOGLE_CLIENT_ID,
      scope: 'https://www.googleapis.com/auth/calendar.freebusy',
      callback: r => {
        if (r && r.access_token) this._res && this._res(r.access_token);
        else this._rej && this._rej(new Error('Google не надав доступ до календаря'));
      },
      error_callback: e => this._rej && this._rej(new Error(
        e && e.type === 'popup_closed' ? 'Вікно Google закрито. Спробуйте ще раз або відмітьте час вручну.'
        : e && e.type === 'popup_failed_to_open' ? 'Браузер заблокував вікно Google. Дозвольте спливаючі вікна для цього сайту.'
        : 'Не вдалося підключити календар'))
    });
  },
  /** Викликати синхронно з обробника натискання. */
  request() {
    if (!this.client) { this.load(); throw new Error('Ще секунду, завантажуємо вхід Google. Натисніть ще раз.'); }
    return new Promise((res, rej) => { this._res = res; this._rej = rej; this.client.requestAccessToken(); });
  },
  async busyCells(token, poll) {
    const days = pollDays(poll), tz = poll.tz || TZ;
    const timeMin = new Date(tzUtc(days[0], poll.hourFrom * 60, tz)).toISOString();
    const timeMax = new Date(tzUtc(days[days.length - 1], poll.hourTo * 60, tz)).toISOString();
    const r = await fetch('https://www.googleapis.com/calendar/v3/freeBusy', {
      method: 'POST',
      headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
      body: JSON.stringify({ timeMin, timeMax, items: [{ id: 'primary' }] })
    });
    const j = await r.json().catch(() => ({}));
    const cal = j.calendars && j.calendars.primary;
    if (!r.ok || !cal || (cal.errors && cal.errors.length)) throw new Error('Не вдалося прочитати календар. Спробуйте ще раз або відмітьте час вручну.');
    const busy = (cal.busy || []).map(b => [Date.parse(b.start), Date.parse(b.end)]);
    const set = new Set();
    for (const d of days) for (const m of pollTimes(poll)) {
      const s0 = tzUtc(d, m, tz), s1 = s0 + STEP * 60e3;
      if (busy.some(([a, b]) => a < s1 && b > s0)) set.add(cellKey(d, m));
    }
    return set;
  }
};
/** UTC-мітка для місцевого часу (дата + хвилини від півночі) у часовому поясі tz. */
function tzOffset(ms, tz) {
  const p = {};
  new Intl.DateTimeFormat('en-US', { timeZone: tz, hourCycle: 'h23', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' })
    .formatToParts(new Date(ms)).forEach(x => { p[x.type] = x.value; });
  return Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour % 24, +p.minute, +p.second) - Math.floor(ms / 1000) * 1000;
}
function tzUtc(date, min, tz) {
  const [y, mo, d] = date.split('-').map(Number);
  const guess = Date.UTC(y, mo - 1, d, Math.floor(min / 60), min % 60);
  let t = guess - tzOffset(guess, tz);
  const t2 = guess - tzOffset(t, tz);
  return t2;
}

/* ---------------- сховище ---------------- */
const Store = {
  mode: 'local',
  async init() { this.mode = LIVE ? 'gas' : 'local'; },
  /** Сервер Apps Script: POST text/plain (без CORS-preflight), помилки приходять у полі error. */
  _db() { try { return JSON.parse(safeLS.get('cp_db') || '{"polls":{}}'); } catch { return { polls: {} }; } },
  _save(db) { safeLS.set('cp_db', JSON.stringify(db)); },
  async _gas(action, payload = {}) {
    let r;
    try {
      r = await fetch(CFG.API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action, payload }) });
    } catch { throw new Error("Немає зв'язку з сервером. Перевірте інтернет і спробуйте ще раз."); }
    const j = await r.json().catch(() => ({ error: 'Сервер відповів неочікувано. Перевірте API_URL у config.js і доступ «Усі» в розгортанні Apps Script.' }));
    if (j.error) throw new Error(j.error);
    return j;
  },
  async createPoll(data) {
    if (this.mode === 'gas') return this._gas('create', data);
    const db = this._db();
    const poll = { ...data, id: uid(8), adminToken: uid(16), createdAt: Date.now(), closedAt: null, final: null, responses: [] };
    db.polls[poll.id] = poll; this._save(db);
    return { id: poll.id, adminToken: poll.adminToken, mailed: 0, mailFailed: [], demo: true };
  },
  async getPoll(id) {
    if (this.mode === 'gas') return this._gas('get', { id });
    const p = this._db().polls[id];
    if (!p) throw new Error('Дзвінок не знайдено');
    const { adminToken, responses, invitees, ...poll } = p;
    return { poll, responses };
  },
  async saveResponse(id, resp) {
    if (this.mode === 'gas') return this._gas('respond', { id, responseId: resp.id, name: resp.name, cells: resp.cells, source: resp.source });
    const db = this._db(), p = db.polls[id];
    if (!p) throw new Error('Дзвінок не знайдено');
    if (isClosed(p)) throw new Error('Збір відповідей уже завершено');
    let r = resp.id && p.responses.find(x => x.id === resp.id);
    if (!r) r = p.responses.find(x => norm(x.name) === norm(resp.name));
    if (r) Object.assign(r, { name: resp.name, cells: resp.cells, source: resp.source, updatedAt: Date.now() });
    else { r = { id: uid(10), name: resp.name, cells: resp.cells, source: resp.source, updatedAt: Date.now() }; p.responses.push(r); }
    this._save(db);
    return { id: r.id };
  },
  async adminAction(id, token, action, payload = {}) {
    if (this.mode === 'gas') return this._gas(action, { id, adminToken: token, ...payload });
    const db = this._db(), p = db.polls[id];
    if (!p || p.adminToken !== token) throw new Error('Немає доступу');
    if (action === 'close') p.closedAt = Date.now();
    if (action === 'finalize') p.final = payload.final;
    this._save(db);
    return { ok: true };
  },
  async checkAdmin(id, token) {
    if (this.mode === 'gas') return this._gas('check', { id, adminToken: token });
    const p = this._db().polls[id];
    if (!p || p.adminToken !== token) throw new Error('Немає доступу');
    return { ok: true, emailNames: (p.invitees || []).filter(i => i.email).map(i => i.name) };
  }
};

/**
 * opts.mode: 'edit' | 'heat'
 * edit: opts.selected (Set), opts.busy (Set), opts.onChange()
 * heat: opts.responses, opts.highlight (slot)
 */
function renderGrid(container, poll, opts) {
  const days = pollDays(poll), times = pollTimes(poll);
  const grid = document.createElement('div');
  grid.className = 'grid';
  grid.style.gridTemplateColumns = `44px repeat(${days.length}, minmax(42px, 1fr))`;
  let html = '<div></div>';
  for (const d of days) html += `<div class="gh" data-day="${d}" title="${opts.mode === 'edit' ? 'Натисніть, щоб виділити / зняти весь день' : esc(fmtDayLong(d))}">${esc(fmtWeekday(d))}<b>${esc(fmtDateNum(d))}</b></div>`;

  let counts = null, names = null, total = 0;
  if (opts.mode === 'heat') {
    counts = new Map(); names = new Map(); total = opts.responses.length;
    for (const r of opts.responses) for (const k of r.cells) {
      counts.set(k, (counts.get(k) || 0) + 1);
      if (!names.has(k)) names.set(k, []); names.get(k).push(r.name);
    }
  }
  const hl = opts.highlight;
  for (const m of times) {
    const isHour = m % 60 === 0;
    html += `<div class="gt${isHour ? '' : ' half'}">${isHour ? hm(m) : ''}</div>`;
    for (const d of days) {
      const k = cellKey(d, m);
      const cls = ['gc'];
      if (isHour && m !== times[0]) cls.push('hr');
      if (opts.mode === 'edit') {
        if (opts.selected.has(k)) cls.push('sel');
        if (opts.busy && opts.busy.has(k)) cls.push('busy');
        html += `<div class="${cls.join(' ')}" data-key="${k}"></div>`;
      } else {
        cls.push('ro');
        if (hl && hl.date === d && m >= hl.start && m < hl.end) cls.push('best');
        const c = counts.get(k) || 0;
        const a = total ? c / total : 0;
        const bg = c ? `background:rgba(var(--heat-rgb),${(0.18 + 0.82 * a).toFixed(2)})` : '';
        const tip = c ? `${hm(m)} — ${c}/${total}: ${(names.get(k) || []).join(', ')}` : `${hm(m)} — нікому не зручно`;
        html += `<div class="${cls.join(' ')}" style="${bg}" title="${esc(tip)}">${c ? `<span class="n">${c}</span>` : ''}</div>`;
      }
    }
  }
  grid.innerHTML = html;
  container.innerHTML = '';
  container.appendChild(grid);

  if (opts.mode !== 'edit' || opts.readOnly) return;
  let dragging = false, addMode = true;
  const apply = el => {
    const k = el?.dataset?.key; if (!k) return;
    if (addMode) opts.selected.add(k); else opts.selected.delete(k);
    el.classList.toggle('sel', addMode);
  };
  grid.addEventListener('pointerdown', e => {
    const el = e.target.closest('.gc'); if (!el) return;
    e.preventDefault();
    dragging = true; addMode = !opts.selected.has(el.dataset.key);
    apply(el);
  });
  grid.addEventListener('pointermove', e => {
    if (!dragging) return;
    apply(document.elementFromPoint(e.clientX, e.clientY)?.closest?.('.gc'));
  });
  const stop = () => { if (dragging) { dragging = false; opts.onChange && opts.onChange(); } };
  window.addEventListener('pointerup', stop);
  window.addEventListener('pointercancel', stop);
  grid.querySelectorAll('.gh').forEach(h => h.addEventListener('click', () => {
    const d = h.dataset.day;
    const keys = times.map(m => cellKey(d, m));
    const all = keys.every(k => opts.selected.has(k));
    keys.forEach(k => all ? opts.selected.delete(k) : opts.selected.add(k));
    renderGrid(container, poll, opts);
    opts.onChange && opts.onChange();
  }));
}

/* ---------------- відлік часу ---------------- */
function countdownText(deadline) {
  let s = Math.max(0, Math.floor((deadline - Date.now()) / 1000));
  if (!s) return 'час вийшов';
  const d = Math.floor(s / 86400); s %= 86400;
  const h = Math.floor(s / 3600); s %= 3600;
  const m = Math.floor(s / 60); s %= 60;
  return (d ? `${d} д ` : '') + `${pad(h)}:${pad(m)}:${pad(s)}`;
}
let tickTimer = null;
function startTicker(deadline, onExpire) {
  clearInterval(tickTimer);
  const tick = () => {
    document.querySelectorAll('[data-countdown]').forEach(el => el.textContent = countdownText(deadline));
    if (Date.now() >= deadline) { clearInterval(tickTimer); onExpire && onExpire(); }
  };
  tick();
  if (Date.now() < deadline) tickTimer = setInterval(tick, 1000);
}

function hourOpts(sel, shift = 0) { let s = ''; for (let h = 0 + shift; h <= 23 + shift; h++) s += `<option value="${h}"${h === sel ? ' selected' : ''}>${pad(h)}:00</option>`; return s; }
function validatePoll(d) {
  if (!d.title) return 'Вкажіть тему дзвінка';
  if (!d.organizer) return "Вкажіть своє ім'я";
  if (!Number.isFinite(d.duration) || d.duration < 15 || d.duration > 480) return 'Тривалість має бути від 15 хвилин до 8 годин';
  if (!d.days.length) return 'Оберіть у календарі хоча б один день';
  if (d.hourTo <= d.hourFrom) return 'Кінцева година має бути пізніше за початкову';
  if (d.duration > (d.hourTo - d.hourFrom) * 60) return 'Дзвінок довший, ніж вибрані години. Розширте години або зменште тривалість';
  if (!Number.isFinite(d.deadline)) return 'Вкажіть, до коли триває голосування';
  if (d.deadline <= Date.now()) return 'Час завершення голосування вже минув. Оберіть пізніший';
  if (d.deadline > Date.now() + 30 * 864e5) return 'Голосування може тривати не довше 30 днів';
  const lastEnd = new Date(d.days[d.days.length - 1] + 'T00:00').getTime() + d.hourTo * 3600e3;
  if (d.deadline >= lastEnd) return 'Голосування має закінчитися раніше, ніж останній обраний день';
  return '';
}

  return `<div class="card">
    <h1>${esc(poll.title)}</h1>
    <p class="muted" style="margin:0">Організатор: ${esc(poll.organizer)} · ${poll.duration} хв · ${pad(poll.hourFrom)}:00–${pad(poll.hourTo)}:00 · ${plural(pollDays(poll).length, 'день', 'дні', 'днів')} (${esc(fmtDay(pollDays(poll)[0]))} – ${esc(fmtDay(pollDays(poll).slice(-1)[0]))})</p>
    <p class="small muted" style="margin:4px 0 0">Голосування до ${esc(fmtDeadline(poll.deadline))}</p>
    <div class="meta">
      ${poll.final ? '<span class="pill ok">✓ Час обрано</span>'
        : closed ? '<span class="pill">Збір завершено</span>'
        : `<span class="pill warn">⏳ До кінця збору: <span class="countdown" data-countdown></span></span>`}
      <span class="pill">Відповіли: ${responses.length}${poll.expected?.length ? ' з ' + (responses.length + missingPeople(poll, responses).length) : ''}</span>
    </div>
    ${extra}
  </div>`;
}

function finalCard(poll, forAdmin) {
  const f = poll.final;
  const start = f.start, d = f.date;
  const g = gcalLink(poll, d, start);
  return `<div class="card final">
    <div class="muted">Дзвінок призначено</div>
    <div class="big">${esc(fmtDayLong(d))}, ${hm(start)}–${hm(start + poll.duration)}</div>
    <p class="muted">${esc(poll.title)} · час за Києвом</p>
    ${f.link ? `<p><a href="${esc(f.link)}" target="_blank" rel="noopener">${esc(f.link)}</a></p>` : ''}
    <div class="actions" style="justify-content:center">
      <a class="btn primary" href="${esc(g)}" target="_blank" rel="noopener">📅 Додати в Google Calendar</a>
      ${forAdmin ? `<a class="btn wa" href="${esc(waLink(finalText(poll)))}" target="_blank" rel="noopener">Надіслати в WhatsApp</a>
      <button class="btn" id="unfinal">Обрати інший час</button>` : ''}
    </div>
  </div>`;
}
function gcalLink(poll, d, start) {
  const ymd = d.replace(/-/g, '');
  const t = m => `${pad(Math.floor(m / 60))}${pad(m % 60)}00`;
  const details = (poll.final?.link ? 'Посилання: ' + poll.final.link + '\n\n' : '') + 'Створено через «Спільний час»';
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE'
    + '&text=' + encodeURIComponent(poll.title)
    + '&dates=' + ymd + 'T' + t(start) + '/' + ymd + 'T' + t(start + poll.duration)
    + '&ctz=' + encodeURIComponent(poll.tz || TZ)
    + '&details=' + encodeURIComponent(details);
}
function finalText(poll) {
  const f = poll.final;
  return `📞 Дзвінок «${poll.title}» призначено!\n🗓 ${fmtDayLong(f.date)}, ${hm(f.start)}–${hm(f.start + poll.duration)} (за Києвом)`
    + (f.link ? `\n🔗 ${f.link}` : '') + `\n\nДодати в календар: ${gcalLink(poll, f.date, f.start)}`;
}

/* ---- сторінка учасника ---- */
async function viewParticipant(id) {
  const { poll, responses } = await Store.getPoll(id);
  const meId = safeLS.get('cp_me_' + id);
  const me = responses.find(r => r.id === meId);
  const closed = isClosed(poll);
  const adminTok = safeLS.get('cp_admin_' + id);

  if (poll.final) {
    app.innerHTML = headerCard(poll, responses) + finalCard(poll, false);
    return;
  }

  const state = { selected: new Set(me ? me.cells : []), busy: null, source: me?.source || 'manual', tab: closed ? 'heat' : 'mine' };
  const invited = (poll.invites || []).find(x => x.id === Nav.params.i);
  const presetName = me?.name || invited?.name || safeLS.get('cp_name') || '';
  const showCal = HAS_GCAL || !LIVE;
  if (HAS_GCAL && !closed) GCal.load().catch(() => {});

  app.innerHTML = headerCard(poll, responses,
    adminTok ? `<p class="small" style="margin:10px 0 0"><a ${navAttrs({ a: id, t: adminTok })}>→ Панель організатора</a></p>` : '') + `
  ${closed ? `<div class="banner">Збір відповідей завершено. Організатор скоро обере час.</div>` : `
  <div class="card">
    <div class="field"><label for="nm">Ваше ім'я</label>
      <input type="text" id="nm" maxlength="60" placeholder="Як вас звати?" value="${esc(presetName)}"></div>
    <button class="btn ${me ? '' : 'primary '}block${showCal ? '' : ' hide'}" id="gcal">📅 Підключити Google Calendar</button>
    <p class="small muted${showCal ? '' : ' hide'}" style="margin:8px 0 0" id="gcalNote">Один клік, і ваші вільні слоти позначаться самі. Ми бачимо лише «зайнято / вільно» у вибрані дні, без назв і змісту подій, і нічого не зберігаємо з вашого календаря.${HAS_GCAL ? '' : ' <b>Демо:</b> зайнятість вигадана.'}</p>
    <p class="small muted" style="margin:10px 0 0">Або просто відмітьте зручний час у сітці нижче.</p>
  </div>`}
  <div class="card">
    <div class="tabs"><button data-tab="mine" class="${state.tab === 'mine' ? 'on' : ''}" ${closed ? 'disabled' : ''}>Мій час</button><button data-tab="heat" class="${state.tab === 'heat' ? 'on' : ''}">Як зручно всім</button></div>
    <p class="small muted" id="hint"></p>
    <div class="grid-wrap" id="grid"></div>
    <div class="legend" id="legend"></div>
  </div>
  ${closed ? '' : `<div class="card" style="position:sticky;bottom:8px;z-index:2">
    <div style="display:flex;gap:10px;align-items:center">
      <div style="flex:1" class="small"><b id="cnt">0</b> <span class="muted">слотів вибрано</span></div>
      <button class="btn primary" id="save">${me ? 'Оновити відповідь' : 'Готово'}</button>
    </div>
  </div>`}`;

  const draw = () => {
    $('#hint').textContent = state.tab === 'mine'
      ? 'Торкніться або проведіть пальцем по клітинках, коли вам зручно. Натисніть на день, щоб виділити його повністю.'
      : 'Чим темніший колір, тим більше людям зручно. Цифра означає, скільки людей можуть у цей час.';
    if (state.tab === 'mine') {
      renderGrid($('#grid'), poll, { mode: 'edit', selected: state.selected, busy: state.busy, onChange: updCnt });
      $('#legend').innerHTML = `<span><i style="background:var(--sel)"></i>мені зручно</span>${state.busy ? '<span><i style="background:repeating-linear-gradient(135deg,var(--busy) 0 3px,transparent 3px 6px)"></i>зайнято в календарі</span>' : ''}`;
    } else {
      renderGrid($('#grid'), poll, { mode: 'heat', responses });
      $('#legend').innerHTML = `<span><i style="background:rgba(var(--heat-rgb),.25)"></i>мало кому</span><span><i style="background:rgba(var(--heat-rgb),1)"></i>усім</span>`;
    }
    updCnt();
  };
  const updCnt = () => { const c = $('#cnt'); if (c) c.textContent = state.selected.size; };
  app.querySelectorAll('[data-tab]').forEach(b => b.addEventListener('click', () => {
    state.tab = b.dataset.tab;
    app.querySelectorAll('[data-tab]').forEach(x => x.classList.toggle('on', x === b));
    draw();
  }));
  draw();
  if (!closed) startTicker(poll.deadline, () => route());

  if (closed) return;
  const applyBusy = busySet => {
    state.busy = busySet;
    state.selected.clear();
    for (const d of pollDays(poll)) for (const m of pollTimes(poll)) { const k = cellKey(d, m); if (!state.busy.has(k)) state.selected.add(k); }
    state.source = 'google'; state.tab = 'mine';
    app.querySelectorAll('[data-tab]').forEach(x => x.classList.toggle('on', x.dataset.tab === 'mine'));
    $('#gcal').textContent = HAS_GCAL ? '✓ Календар підключено' : '✓ Календар підключено (демо)';
    $('#gcal').classList.remove('primary');
    $('#gcalNote').textContent = 'Усі вільні слоти позначено. Зніміть ті, які не підходять (наприклад, коли ви в дорозі), і натисніть «Готово».';
    draw();
    $('#grid').scrollIntoView({ behavior: 'smooth', block: 'start' });
  };
  $('#gcal').addEventListener('click', () => {
    if (!HAS_GCAL) {
      const name = $('#nm').value.trim() || 'гість';
      applyBusy(fakeBusy(poll, name));
      return;
    }
    // Вікно Google має відкритися прямо з натискання, інакше браузер його заблокує
    const btn = $('#gcal');
    let req;
    try { req = GCal.request(); } catch (ex) { toast(ex.message); return; }
    btn.disabled = true; btn.textContent = 'Підключаємо…';
    req.then(token => GCal.busyCells(token, poll))
      .then(set => applyBusy(set))
      .catch(ex => { toast(ex.message); btn.textContent = '📅 Підключити Google Calendar'; })
      .finally(() => { btn.disabled = false; });
  });
  $('#save').addEventListener('click', async () => {
    const name = $('#nm').value.trim();
    if (!name) { $('#nm').focus(); toast("Вкажіть своє ім'я"); window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
    if (!state.selected.size && !armed($('#save'), 'Жодного слоту. Зберегти все одно?')) return;
    const btn = $('#save');
    btn.disabled = true; btn.textContent = 'Зберігаємо…';
    try {
      const { id: rid } = await Store.saveResponse(id, { id: meId, name, cells: [...state.selected], source: state.source });
      safeLS.set('cp_me_' + id, rid);
      safeLS.set('cp_name', name);
      toast('Дякуємо! Відповідь збережено');
      route();
    } catch (ex) { toast(ex.message); btn.disabled = false; btn.textContent = me ? 'Оновити відповідь' : 'Готово'; }
  });
}

/* ---- сторінка організатора ---- */
function createdBanner(res) {
  const n = res.mailed || 0, failed = res.mailFailed || [];
  let msg = '✓ Дзвінок створено!';
  if (n) msg += ` Запрошення надіслано на пошту: ${plural(n, 'людині', 'людям', 'людям')}.`;
  msg += ' Надішліть посилання і в групу WhatsApp.';
  return `<div class="banner ok">${esc(msg)}</div>`
    + (failed.length ? `<div class="banner">Не вдалося надіслати лист на: ${esc(failed.join(', '))}. Перевірте адреси або надішліть посилання вручну.</div>` : '')
    + (res.demo && res.hadEmails ? '<div class="banner">Демо-режим: листи не надсилаються.</div>' : '');
}
async function viewAdmin(id, token, isNew) {
  const adm = await Store.checkAdmin(id, token).catch(() => null);
  if (!adm) { app.innerHTML = `<div class="card"><h1>Немає доступу</h1><p class="muted">Посилання організатора неправильне.</p><a class="btn" ${navAttrs({ p: id })}>Відкрити як учасник</a></div>`; return; }
  safeLS.set('cp_admin_' + id, token);
  const { poll, responses } = await Store.getPoll(id);
  const closed = isClosed(poll);
  const pLink = Nav.link({ p: id });
  const aLink = Nav.link({ a: id, t: token });
  const missing = missingPeople(poll, responses);
  const slots = rankSlots(poll, responses);
  const withEmail = new Set((adm.emailNames || []).map(norm));
  const missingMail = missing.filter(n => withEmail.has(norm(n)));
  const inviteText = `Привіт! 👋 Плануємо дзвінок «${poll.title}». Відмітьте, будь ласка, коли вам зручно (займе хвилину). Збір до ${fmtDeadline(poll.deadline)}:\n${pLink}`;
  const remindText = `Нагадування 🙂 ${missing.length ? missing.join(', ') + ', в' : 'В'}ідмітьте, будь ласка, зручний час для дзвінка «${poll.title}» до ${fmtDeadline(poll.deadline)}:\n${pLink}`;

  const medals = ['🥇', '🥈', '🥉'];
  const total = responses.length;
  const slotsHtml = slots.length ? slots.map((s, i) => `
    <div class="slot${i === 0 ? ' first' : ''}">
      <div class="medal">${medals[i]}</div>
      <div class="body">
        <div class="when">${esc(fmtDayLong(s.date))}, ${hm(s.start)}–${hm(s.end)}</div>
        <div class="bar"><span style="width:${Math.round(s.yes.length / total * 100)}%"></span></div>
        <div class="small"><b>${s.yes.length === total ? 'Можуть усі ' + total : `Можуть ${s.yes.length} з ${total}`}</b>${s.no.length ? ` · <span class="muted">не можуть: ${esc(s.no.join(', '))}</span>` : ''}</div>
        ${missing.length ? `<div class="small muted">ще не відповіли: ${esc(missing.join(', '))}</div>` : ''}
      </div>
      ${poll.final ? '' : `<button class="btn ${i === 0 ? 'primary' : ''} sm" data-pick="${i}">Обрати</button>`}
    </div>`).join('')
    : `<p class="muted">${total ? 'Спільного часу поки немає: ніхто не вибрав слоти, що вміщують дзвінок повністю.' : 'Поки ніхто не відповів. Найкращі варіанти з\'являться тут.'}</p>`;

  app.innerHTML = `
  ${isNew ? createdBanner(isNew) : ''}
  ${headerCard(poll, responses)}
  ${poll.final ? finalCard(poll, true) : ''}
  ${poll.final ? '' : `<div class="card">
    <h2>Посилання для учасників</h2>
    <div class="copy"><input type="text" readonly value="${esc(pLink)}"><button class="btn sm" id="cpP">Копіювати</button></div>
    <div class="actions" style="margin-top:10px">
      <a class="btn wa" href="${esc(waLink(inviteText))}" target="_blank" rel="noopener">Надіслати в WhatsApp</a>
      <a class="btn" ${navAttrs({ p: id })}>Відмітити свій час</a>
    </div>
  </div>`}
  ${poll.final ? '' : `<div class="card">
    <h2>Хто відповів</h2>
    <div class="people">
      ${responses.map(r => `<span class="pill ok">✓ ${esc(r.name)}${r.source === 'google' ? ' 📅' : ''}</span>`).join('') || '<span class="muted small">Поки нікого</span>'}
      ${missing.map(n => `<span class="pill">${esc(n)}${withEmail.has(norm(n)) ? ' ✉' : ''}</span>`).join('')}
    </div>
    ${!closed ? `<div class="actions" style="margin-top:12px">
      <a class="btn sm" href="${esc(waLink(remindText))}" target="_blank" rel="noopener">🔔 Нагадати${missing.length ? ' (' + missing.length + ')' : ''} у WhatsApp</a>
      ${LIVE && missingMail.length ? `<button class="btn sm" id="remindMail">✉ Нагадати поштою (${missingMail.length})</button>` : ''}
      <button class="btn sm" id="closeNow">Завершити збір зараз</button>
      <button class="btn sm" id="demo" title="Додає вигаданих учасників, щоб подивитися, як працюють результати">+ Тестові учасники</button>
    </div>` : ''}
  </div>`}
  <div class="card">
    <h2>${poll.final ? 'Варіанти' : closed ? 'Найкращі варіанти. Оберіть час' : 'Поточні лідери'}</h2>
    ${!closed && !poll.final ? '<p class="small muted">Збір ще триває, тож картина може змінитися. Обрати час можна вже зараз або дочекатися кінця таймера.</p>' : ''}
    ${!poll.final && slots.length ? `<div class="field"><label for="meet">Посилання на дзвінок <span class="muted">(Meet / Zoom, необов'язково)</span></label><input type="url" id="meet" placeholder="https://meet.google.com/..."></div>` : ''}
    ${slotsHtml}
  </div>
  <div class="card">
    <h2>Загальна картина</h2>
    <div class="grid-wrap" id="grid"></div>
    <div class="legend"><span><i style="background:rgba(var(--heat-rgb),.25)"></i>мало кому</span><span><i style="background:rgba(var(--heat-rgb),1)"></i>усім</span><span><i style="outline:2px solid var(--warn);outline-offset:-2px;background:transparent"></i>найкращий слот</span></div>
  </div>
  <div class="card"><h2>Ваше посилання організатора</h2>
    <p class="small muted">Збережіть його: лише за ним можна обрати фінальний час.</p>
    <div class="copy"><input type="text" readonly value="${esc(aLink)}"><button class="btn sm" id="cpA">Копіювати</button></div>
  </div>`;

  renderGrid($('#grid'), poll, { mode: 'heat', responses, highlight: poll.final ? { date: poll.final.date, start: poll.final.start, end: poll.final.start + poll.duration } : slots[0] });
  if (!closed && !poll.final) startTicker(poll.deadline, () => route());

  $('#cpP')?.addEventListener('click', () => copyText(pLink, $('#cpP').previousElementSibling));
  $('#cpA')?.addEventListener('click', () => copyText(aLink, $('#cpA').previousElementSibling));
  $('#remindMail')?.addEventListener('click', e => {
    if (!armed(e.currentTarget, `Надіслати лист ${missingMail.length} людям?`)) return;
    busy(e.currentTarget, async () => {
      const r = await Store.adminAction(id, token, 'remind');
      const f = r.mailFailed || [];
      toast((r.mailed ? `Нагадування надіслано: ${r.mailed}` : 'Жодного листа не надіслано') + (f.length ? `. Не вдалося: ${f.join(', ')}` : ''));
    });
  });
  $('#closeNow')?.addEventListener('click', e => {
    if (!armed(e.currentTarget, 'Точно завершити? Натисніть ще раз')) return;
    busy(e.currentTarget, async () => { await Store.adminAction(id, token, 'close'); route(); });
  });
  $('#unfinal')?.addEventListener('click', e => busy(e.currentTarget, async () => { await Store.adminAction(id, token, 'finalize', { final: null }); route(); }));
  app.querySelectorAll('[data-pick]').forEach(b => b.addEventListener('click', () => {
    const s = slots[+b.dataset.pick];
    const link = ($('#meet')?.value || '').trim();
    if (link && !/^https?:\/\//i.test(link)) { toast('Посилання має починатися з https://'); return; }
    busy(b, async () => {
      await Store.adminAction(id, token, 'finalize', { final: { date: s.date, start: s.start, link } });
      toast('Час обрано!');
      route();
    });
  }));
  $('#demo')?.addEventListener('click', e => busy(e.currentTarget, async () => {
    const pool = ['Олена', 'Андрій', 'Марта', 'Ігор', 'Світлана', 'Богдан', 'Наталія', 'Тарас'];
    const taken = new Set(responses.map(r => norm(r.name)));
    const names = [...missing, ...pool].filter((n, i, a) => !taken.has(norm(n)) && a.findIndex(x => norm(x) === norm(n)) === i).slice(0, 4);
    for (const n of names) {
      const busy = fakeBusy(poll, n), cells = [];
      const r = rng(hashStr(n));
      for (const d of pollDays(poll)) for (const m of pollTimes(poll)) { const k = cellKey(d, m); if (!busy.has(k) && r() > 0.25) cells.push(k); }
      await Store.saveResponse(id, { name: n, cells, source: 'google' });
    }
    toast('Додано тестових учасників: ' + names.length);
    route();
  }));
}

/* ---------------- роутер ---------------- */
let justCreated = false;
async function route() {
  clearInterval(tickTimer);
  const P = Nav.params;
  const isPage = !!(P.p || (P.a && P.t));
  if (isPage && !app.querySelector('.card')) app.innerHTML = '<div class="card muted">Завантаження…</div>';
  app.style.opacity = isPage ? '.55' : '';
  const fresh = justCreated; justCreated = false;
  try {
    if (P.p) await viewParticipant(P.p);
    else if (P.a && P.t) await viewAdmin(P.a, P.t, fresh);
    else viewCreate();
  } catch (ex) {
    app.innerHTML = `<div class="card"><h1>Упс</h1><p class="muted">${esc(ex.message)}</p><a class="btn" ${navAttrs({})}>Створити новий дзвінок</a></div>`;
  } finally {
    app.style.opacity = '';
  }
}

(async () => {
  await Store.init();
  const b = $('#modeBadge');
  if (Store.mode === 'local') { b.textContent = 'Демо-режим'; b.title = 'Дані зберігаються лише в цьому браузері.'; b.classList.remove('hide'); }
  else document.querySelector('#ftText').textContent = 'Спільний час';
  Nav.init();
  route();
})();
</script>
