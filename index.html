<script src="config.js"></script>
<script>
'use strict';
/* =========================================================================
 * Спільний час — прототип планувальника дзвінків
 *  • Організатор створює дзвінок (тема, тривалість, дати, години, дедлайн)
 *  • Учасники відкривають посилання і відмічають зручні слоти
 *    (можна «підтягнути» зайнятість з Google Calendar — у прототипі симуляція)
 *  • Після дедлайну організатор бачить топ-3 слоти й обирає один
 * Сайт (GitHub Pages) + сервер на Google Apps Script (дані в Google Таблиці).
 * Налаштування — у файлі config.js. Якщо API_URL порожній, працює демо-режим (localStorage).
 * ========================================================================= */

const STEP = 30;                 // крок сітки, хв
const TZ = 'Europe/Kyiv';        // часовий пояс дзвінків (прототип: один для всіх)

const CFG = Object.assign({ API_URL: '', GOOGLE_CLIENT_ID: '' }, window.SC_CONFIG || {});
const LIVE = !!CFG.API_URL;                         // є сервер Apps Script
const HAS_GCAL = !!CFG.GOOGLE_CLIENT_ID;            // справжнє підключення Google Calendar
const HASH_NAV = location.protocol === 'file:';     // відкрито як файл — навігація через #

/* ---------------- утиліти ---------------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = (n = 10) => { const a = new Uint8Array(n); crypto.getRandomValues(a); return Array.from(a, b => 'abcdefghijkmnpqrstuvwxyz23456789'[b % 32]).join(''); };
const pad = n => String(n).padStart(2, '0');
const hm = min => `${pad(Math.floor(min / 60))}:${pad(min % 60)}`;
const norm = s => String(s || '').trim().toLowerCase();
const dObj = d => new Date(d + 'T12:00:00Z');
const isoDate = dt => dt.toISOString().slice(0, 10);
const addDays = (d, n) => { const x = dObj(d); x.setUTCDate(x.getUTCDate() + n); return isoDate(x); };
const todayLocal = () => { const n = new Date(); return `${n.getFullYear()}-${pad(n.getMonth() + 1)}-${pad(n.getDate())}`; };
const fmtDay = d => new Intl.DateTimeFormat('uk-UA', { weekday: 'short', day: 'numeric', month: 'short', timeZone: 'UTC' }).format(dObj(d));
const fmtDayLong = d => new Intl.DateTimeFormat('uk-UA', { weekday: 'long', day: 'numeric', month: 'long', timeZone: 'UTC' }).format(dObj(d));
const fmtWeekday = d => new Intl.DateTimeFormat('uk-UA', { weekday: 'short', timeZone: 'UTC' }).format(dObj(d));
const fmtDateNum = d => new Intl.DateTimeFormat('uk-UA', { day: 'numeric', month: 'numeric', timeZone: 'UTC' }).format(dObj(d));
const fmtDeadline = ms => new Intl.DateTimeFormat('uk-UA', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }).format(new Date(ms));
const plural = (n, one, few, many) => { const a = n % 10, b = n % 100; return n + ' ' + (a === 1 && b !== 11 ? one : a >= 2 && a <= 4 && (b < 10 || b >= 20) ? few : many); };
function hashStr(s) { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(seed) { return () => { seed = (seed + 0x6D2B79F5) >>> 0; let t = seed; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), 2200); }
async function copyText(text, input) { try { await navigator.clipboard.writeText(text); toast('Скопійовано'); } catch { if (input) { input.focus(); input.select(); } toast('Виділено: скопіюйте вручну'); } }
/** Блокує кнопку на час дії й показує помилку, якщо щось пішло не так. */
async function busy(btn, fn) {
  const orig = btn.textContent;
  btn.disabled = true; btn.textContent = '…';
  try { await fn(); } catch (ex) { toast(ex.message); }
  finally { if (btn.isConnected) { btn.disabled = false; btn.textContent = orig; } }
}
/** Двоетапне підтвердження прямо на кнопці (без confirm()). Повертає true з другого натискання. */
function armed(btn, label) {
  if (btn.dataset.armed) return true;
  btn.dataset.armed = '1'; btn.dataset.orig = btn.textContent; btn.textContent = label;
  setTimeout(() => { if (btn.isConnected) { delete btn.dataset.armed; btn.textContent = btn.dataset.orig; } }, 4000);
  return false;
}
const safeLS = {
  get(k) { try { return localStorage.getItem(k); } catch { return safeLS.mem[k] ?? null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch { safeLS.mem[k] = v; } },
  mem: {}
};
/* ---------------- навігація ----------------
 * Стан у адресі: ?p=<id> (учасник), ?p=<id>&i=<запрошення>, ?a=<id>&t=<токен> (організатор). */
const qs = o => Object.keys(o).filter(k => o[k] !== undefined && o[k] !== '').map(k => encodeURIComponent(k) + '=' + encodeURIComponent(o[k])).join('&');
const parseQs = str => { const o = {}; new URLSearchParams(str).forEach((v, k) => o[k] = v); return o; };
const Nav = {
  params: {},
  _read() { return parseQs(HASH_NAV ? location.hash.slice(1) : location.search.slice(1)); },
  init() {
    this.params = this._read();
    window.addEventListener(HASH_NAV ? 'hashchange' : 'popstate', () => { this.params = this._read(); route(); });
  },
  go(params) {
    const q = qs(params);
    if (HASH_NAV) { if (location.hash.slice(1) === q) route(); else location.hash = q; return; }
    history.pushState(null, '', location.pathname + (q ? '?' + q : ''));
    this.params = params;
    window.scrollTo(0, 0);
    route();
  },
  link(params) {
    const q = qs(params);
    const base = location.href.split(/[?#]/)[0];
    return base + (q ? (HASH_NAV ? '#' : '?') + q : '');
  }
};
/** Посилання всередині застосунку: <a data-nav='{"p":"id"}'> */
const navAttrs = params => `href="${esc(Nav.link(params))}" data-nav="${esc(JSON.stringify(params))}"`;
document.addEventListener('click', e => {
  const a = e.target.closest && e.target.closest('a[data-nav]');
  if (!a || e.metaKey || e.ctrlKey || e.shiftKey) return;
  e.preventDefault();
  Nav.go(JSON.parse(a.dataset.nav || '{}'));
});
function waLink(text) { return 'https://wa.me/?text=' + encodeURIComponent(text); }

/* ---------------- модель ---------------- */
function pollDays(p) {
  if (Array.isArray(p.days) && p.days.length) return p.days.slice().sort();
  const out = [];
  for (let d = p.dateFrom; d <= p.dateTo; d = addDays(d, 1)) {
    const wd = dObj(d).getUTCDay();
    if (p.skipWeekends && (wd === 0 || wd === 6)) continue;
    out.push(d);
  }
  return out;
}
function pollTimes(p) { const out = []; for (let m = p.hourFrom * 60; m < p.hourTo * 60; m += STEP) out.push(m); return out; }
const cellKey = (d, m) => `${d}|${m}`;
const isClosed = p => !!p.closedAt || Date.now() >= p.deadline;

/** Рахує всі можливі старти та повертає топ-N слотів без перетинів. */
function rankSlots(poll, responses, topN = 3) {
  const need = Math.ceil(poll.duration / STEP);
  const sets = responses.map(r => ({ name: r.name, cells: new Set(r.cells) }));
  const cands = [];
  for (const d of pollDays(poll)) {
    for (let m = poll.hourFrom * 60; m + poll.duration <= poll.hourTo * 60; m += STEP) {
      const keys = Array.from({ length: need }, (_, i) => cellKey(d, m + i * STEP));
      const yes = [], no = [];
      for (const s of sets) (keys.every(k => s.cells.has(k)) ? yes : no).push(s.name);
      if (yes.length) cands.push({ date: d, start: m, end: m + poll.duration, yes, no });
    }
  }
  cands.sort((a, b) => b.yes.length - a.yes.length || (a.date < b.date ? -1 : a.date > b.date ? 1 : a.start - b.start));
  const picked = [];
  for (const c of cands) {
    if (picked.some(p => p.date === c.date && c.start < p.end && p.start < c.end)) continue;
    picked.push(c);
    if (picked.length >= topN) break;
  }
  return picked;
}

/** Імена очікуваних учасників, які ще не відповіли. */
function missingPeople(poll, responses) {
  const got = new Set(responses.map(r => norm(r.name)));
  return (poll.expected || []).filter(n => !got.has(norm(n)));
}

/** Симуляція Google Calendar: детерміновані «зайняті» блоки для імені. */
function fakeBusy(poll, name) {
  const r = rng(hashStr(norm(name) + poll.id));
  const busy = new Set();
  for (const d of pollDays(poll)) {
    const blocks = 1 + Math.floor(r() * 3);
    for (let b = 0; b < blocks; b++) {
      const len = 2 + Math.floor(r() * 4);
      const start = poll.hourFrom * 60 + Math.floor(r() * ((poll.hourTo - poll.hourFrom) * 2)) * STEP;
      for (let i = 0; i < len; i++) { const m = start + i * STEP; if (m < poll.hourTo * 60) busy.add(cellKey(d, m)); }
    }
  }
  return busy;
}

/* ---------------- Google Calendar ----------------
 * Вхід через Google Identity Services у браузері учасника. Доступ лише calendar.freebusy:
 * Google віддає проміжки «зайнято» без назв і змісту подій. Токен живе лише в пам'яті сторінки. */
const GCal = {
  _load: null, client: null, _res: null, _rej: null,
  load() {
    if (this._load) return this._load;
    this._load = new Promise((res, rej) => {
      const sc = document.createElement('script');
      sc.src = 'https://accounts.google.com/gsi/client'; sc.async = true;
      sc.onload = () => { this._init(); res(); };
      sc.onerror = () => { this._load = null; rej(new Error('Не вдалося завантажити вхід Google. Перевірте інтернет.')); };
      document.head.appendChild(sc);
    });
    return this._load;
  },
  _init() {
    this.client = google.accounts.oauth2.initTokenClient({
      client_id: CFG.GOOGLE_CLIENT_ID,
      scope: 'https://www.googleapis.com/auth/calendar.freebusy',
      callback: r => {
        if (r && r.access_token) this._res && this._res(r.access_token);
        else this._rej && this._rej(new Error('Google не надав доступ до календаря'));
      },
      error_callback: e => this._rej && this._rej(new Error(
        e && e.type === 'popup_closed' ? 'Вікно Google закрито. Спробуйте ще раз або відмітьте час вручну.'
        : e && e.type === 'popup_failed_to_open' ? 'Браузер заблокував вікно Google. Дозвольте спливаючі вікна для цього сайту.'
        : 'Не вдалося підключити календар'))
    });
  },
  /** Викликати синхронно з обробника натискання. */
  request() {
    if (!this.client) { this.load(); throw new Error('Ще секунду, завантажуємо вхід Google. Натисніть ще раз.'); }
    return new Promise((res, rej) => { this._res = res; this._rej = rej; this.client.requestAccessToken(); });
  },
  async busyCells(token, poll) {
    const days = pollDays(poll), tz = poll.tz || TZ;
    // для регулярного дзвінка дивимось 4 найближчі повторення: «зайнято», якщо зайнято хоча б у 2
    const occ = d => poll.repeat ? occurrences(poll.repeat, d, 4) : [d];
    const need = poll.repeat ? 2 : 1;
    const allDates = days.flatMap(occ).sort();
    const timeMin = new Date(tzUtc(allDates[0], poll.hourFrom * 60, tz)).toISOString();
    const timeMax = new Date(tzUtc(allDates[allDates.length - 1], poll.hourTo * 60, tz)).toISOString();
    const r = await fetch('https://www.googleapis.com/calendar/v3/freeBusy', {
      method: 'POST',
      headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
      body: JSON.stringify({ timeMin, timeMax, items: [{ id: 'primary' }] })
    });
    const j = await r.json().catch(() => ({}));
    const cal = j.calendars && j.calendars.primary;
    if (!r.ok || !cal || (cal.errors && cal.errors.length)) throw new Error('Не вдалося прочитати календар. Спробуйте ще раз або відмітьте час вручну.');
    const busy = (cal.busy || []).map(b => [Date.parse(b.start), Date.parse(b.end)]);
    const set = new Set();
    for (const d of days) for (const m of pollTimes(poll)) {
      const hits = occ(d).filter(x => { const s0 = tzUtc(x, m, tz), s1 = s0 + STEP * 60e3; return busy.some(([a, b]) => a < s1 && b > s0); }).length;
      if (hits >= need) set.add(cellKey(d, m));
    }
    return set;
  }
};
/** UTC-мітка для місцевого часу (дата + хвилини від півночі) у часовому поясі tz. */
function tzOffset(ms, tz) {
  const p = {};
  new Intl.DateTimeFormat('en-US', { timeZone: tz, hourCycle: 'h23', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' })
    .formatToParts(new Date(ms)).forEach(x => { p[x.type] = x.value; });
  return Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour % 24, +p.minute, +p.second) - Math.floor(ms / 1000) * 1000;
}
function tzUtc(date, min, tz) {
  const [y, mo, d] = date.split('-').map(Number);
  const guess = Date.UTC(y, mo - 1, d, Math.floor(min / 60), min % 60);
  let t = guess - tzOffset(guess, tz);
  const t2 = guess - tzOffset(t, tz);
  return t2;
}

const Store = {
  mode: 'local',

    } catch { throw new Error("Немає зв'язку з сервером. Перевірте інтернет і спробуйте ще раз."); }
    const j = await r.json().catch(() => ({ error: 'Сервер відповів неочікувано. Перевірте API_URL у config.js і доступ «Усі» в розгортанні Apps Script.' }));
    if (j.error) throw new Error(j.error);
    return j;
  },
  async createPoll(data) {
    if (this.mode === 'gas') return this._gas('create', data);
    const db = this._db();
    const poll = { ...data, id: uid(8), adminToken: uid(16), createdAt: Date.now(), closedAt: null, final: null, responses: [] };
    db.polls[poll.id] = poll; this._save(db);
    return { id: poll.id, adminToken: poll.adminToken, mailed: 0, mailFailed: [], demo: true };
  },
  async getPoll(id) {
    if (this.mode === 'gas') return this._gas('get', { id });
    const p = this._db().polls[id];
    if (!p) throw new Error('Дзвінок не знайдено');
    const { adminToken, responses, invitees, ...poll } = p;
    return { poll, responses };
  },
  async saveResponse(id, resp) {
    if (this.mode === 'gas') return this._gas('respond', { id, responseId: resp.id, name: resp.name, cells: resp.cells, source: resp.source });
    const db = this._db(), p = db.polls[id];
    if (!p) throw new Error('Дзвінок не знайдено');
    if (isClosed(p)) throw new Error('Збір відповідей уже завершено');
    let r = resp.id && p.responses.find(x => x.id === resp.id);
    if (!r) r = p.responses.find(x => norm(x.name) === norm(resp.name));
    if (r) Object.assign(r, { name: resp.name, cells: resp.cells, source: resp.source, updatedAt: Date.now() });
    else { r = { id: uid(10), name: resp.name, cells: resp.cells, source: resp.source, updatedAt: Date.now() }; p.responses.push(r); }
    this._save(db);
    return { id: r.id };
  },
  async adminAction(id, token, action, payload = {}) {
    if (this.mode === 'gas') return this._gas(action, { id, adminToken: token, ...payload });
    const db = this._db(), p = db.polls[id];
    if (!p || p.adminToken !== token) throw new Error('Немає доступу');
    if (action === 'close') p.closedAt = Date.now();
    if (action === 'finalize') p.final = payload.final;
    this._save(db);
    return { ok: true };
  },

    if (this.mode !== 'gas') throw new Error('У демо-режимі вхід не працює');
    return this._gas('login', { email, siteUrl: location.href.split(/[?#]/)[0] });

  }
};

/**
 * opts.mode: 'edit' | 'heat'
 * edit: opts.selected (Set), opts.busy (Set), opts.onChange()
 * heat: opts.responses, opts.highlight (slot)
 */
function renderGrid(container, poll, opts) {
  const days = pollDays(poll), times = pollTimes(poll);
  const grid = document.createElement('div');
  grid.className = 'grid';
  grid.style.gridTemplateColumns = `44px repeat(${days.length}, minmax(42px, 1fr))`;
  let html = '<div></div>';
  for (const d of days) html += `<div class="gh" data-day="${d}" title="${opts.mode === 'edit' ? 'Натисніть, щоб виділити / зняти весь день' : esc(slotTitle(poll, d))}">${poll.repeat ? `<b>${WD_SHORT[wdOf(d)]}</b>` : `${esc(fmtWeekday(d))}<b>${esc(fmtDateNum(d))}</b>`}</div>`;

  let counts = null, names = null, total = 0;
  if (opts.mode === 'heat') {
    counts = new Map(); names = new Map(); total = opts.responses.length;
    for (const r of opts.responses) for (const k of r.cells) {
      counts.set(k, (counts.get(k) || 0) + 1);
      if (!names.has(k)) names.set(k, []); names.get(k).push(r.name);
    }
  }
  const hl = opts.highlight;
  for (const m of times) {
    const isHour = m % 60 === 0;
    html += `<div class="gt${isHour ? '' : ' half'}">${isHour ? hm(m) : ''}</div>`;
    for (const d of days) {
      const k = cellKey(d, m);
      const cls = ['gc'];
      if (isHour && m !== times[0]) cls.push('hr');
      if (opts.mode === 'edit') {
        if (opts.selected.has(k)) cls.push('sel');
        if (opts.busy && opts.busy.has(k)) cls.push('busy');
        html += `<div class="${cls.join(' ')}" data-key="${k}"></div>`;
      } else {
        cls.push('ro');
        if (hl && hl.date === d && m >= hl.start && m < hl.end) cls.push('best');
        const c = counts.get(k) || 0;
        const a = total ? c / total : 0;
        const bg = c ? `background:rgba(var(--heat-rgb),${(0.18 + 0.82 * a).toFixed(2)})` : '';
        const tip = c ? `${hm(m)} — ${c}/${total}: ${(names.get(k) || []).join(', ')}` : `${hm(m)} — нікому не зручно`;
        html += `<div class="${cls.join(' ')}" style="${bg}" title="${esc(tip)}">${c ? `<span class="n">${c}</span>` : ''}</div>`;
      }
    }
  }
  grid.innerHTML = html;
  container.innerHTML = '';
  container.appendChild(grid);

  if (opts.mode !== 'edit' || opts.readOnly) return;
  let dragging = false, addMode = true;
  const apply = el => {
    const k = el?.dataset?.key; if (!k) return;
    if (addMode) opts.selected.add(k); else opts.selected.delete(k);
    el.classList.toggle('sel', addMode);
  };
  grid.addEventListener('pointerdown', e => {
    const el = e.target.closest('.gc'); if (!el) return;
    e.preventDefault();
    dragging = true; addMode = !opts.selected.has(el.dataset.key);
    apply(el);
  });
  grid.addEventListener('pointermove', e => {
    if (!dragging) return;
    apply(document.elementFromPoint(e.clientX, e.clientY)?.closest?.('.gc'));
  });
  const stop = () => { if (dragging) { dragging = false; opts.onChange && opts.onChange(); } };
  window.addEventListener('pointerup', stop);
  window.addEventListener('pointercancel', stop);
  grid.querySelectorAll('.gh').forEach(h => h.addEventListener('click', () => {
    const d = h.dataset.day;
    const keys = times.map(m => cellKey(d, m));
    const all = keys.every(k => opts.selected.has(k));
    keys.forEach(k => all ? opts.selected.delete(k) : opts.selected.add(k));
    renderGrid(container, poll, opts);
    opts.onChange && opts.onChange();
  }));
}

/* ---------------- відлік часу ---------------- */
function countdownText(deadline) {
  let s = Math.max(0, Math.floor((deadline - Date.now()) / 1000));
  if (!s) return 'час вийшов';
  const d = Math.floor(s / 86400); s %= 86400;
  const h = Math.floor(s / 3600); s %= 3600;
  const m = Math.floor(s / 60); s %= 60;
  return (d ? `${d} д ` : '') + `${pad(h)}:${pad(m)}:${pad(s)}`;
}
let tickTimer = null;
function startTicker(deadline, onExpire) {
  clearInterval(tickTimer);
  const tick = () => {
    document.querySelectorAll('[data-countdown]').forEach(el => el.textContent = countdownText(deadline));
    if (Date.now() >= deadline) { clearInterval(tickTimer); onExpire && onExpire(); }
  };
  tick();
  if (Date.now() < deadline) tickTimer = setInterval(tick, 1000);
}

const EMAIL_RE = /^[^\s@<>()",;]+@[^\s@<>()",;]+\.[^\s@<>()",;]+$/;
/* Підказка для описок у популярних поштових доменах: gmail.con → gmail.com */
const MAIL_DOMAINS = ['gmail.com', 'ukr.net', 'i.ua', 'meta.ua', 'outlook.com', 'hotmail.com', 'icloud.com', 'yahoo.com', 'proton.me', 'protonmail.com', 'me.com', 'live.com'];
function editDist(a, b) {
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i, ...Array(b.length).fill(0)]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1),
      i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1] ? d[i - 2][j - 2] + 1 : Infinity);
  return d[a.length][b.length];
}
/** Повертає виправлену адресу, якщо домен схожий на популярний (але не збігається), інакше ''. */
function emailTypo(email) {
  const at = email.lastIndexOf('@'); if (at < 0) return '';
  const dom = email.slice(at + 1).toLowerCase();
  if (MAIL_DOMAINS.includes(dom)) return '';
  const best = MAIL_DOMAINS.map(x => [x, editDist(dom, x)]).sort((a, b) => a[1] - b[1])[0];
  return best && best[1] > 0 && best[1] <= 2 && dom.length > 3 ? email.slice(0, at + 1) + best[0] : '';
}
/** Текст помилки для адреси або ''. */
function emailProblem(email) {
  emailProblem.ok = emailProblem.ok || new Set();
  if (!EMAIL_RE.test(email)) return `Здається, в пошті помилка: ${email}`;
  const fix = emailTypo(email);
  if (!fix || emailProblem.ok.has(email)) return '';
  emailProblem.ok.add(email); // якщо людина натисне ще раз — значить, адреса правильна
  return `Перевірте пошту: ${email}. Можливо, ви мали на увазі ${fix}? Якщо все правильно, натисніть ще раз.`;
}

/** «щотижня, по вівторках», «раз на 2 тижні, вівторок», «щомісяця, 4-й вівторок» */
function repeatText(r, wd) {
  if (!r) return '';
  if (r.freq === 'month') return wd === undefined
    ? 'щомісяця, ' + NTH_GEN[r.nth] + ' тижня'
    : 'щомісяця, ' + NTH_GEN[r.nth] + ' тижня, ' + WD_FULL[wd];
  if (r.interval === 2) return 'раз на 2 тижні' + (wd === undefined ? '' : ', ' + WD_FULL[wd]);
  return 'щотижня' + (wd === undefined ? '' : ', по ' + WD_PO[wd]);
}
function nthWeekday(y, m, wd, nth) {
  if (nth === -1) {
    const last = new Date(Date.UTC(y, m + 1, 0));
    return isoDate(new Date(Date.UTC(y, m, last.getUTCDate() - (last.getUTCDay() - wd + 7) % 7)));
  }
  const first = new Date(Date.UTC(y, m, 1));
  return isoDate(new Date(Date.UTC(y, m, 1 + (wd - first.getUTCDay() + 7) % 7 + 7 * (nth - 1))));
}
/** Перша дата з днем тижня wd, строго після afterDate. */
function firstOccurrence(r, wd, afterDate) {
  if (r.freq === 'month') {
    const a = dObj(afterDate);
    for (let k = 0; k < 4; k++) {
      const c = nthWeekday(a.getUTCFullYear(), a.getUTCMonth() + k, wd, r.nth);
      if (c > afterDate) return c;
    }
  }
  let d = addDays(afterDate, 1);
  while (wdOf(d) !== wd) d = addDays(d, 1);
  return d;
}
/** n найближчих повторень, починаючи з date. */
function occurrences(r, date, n) {
  const out = [date];
  const a = dObj(date);
  for (let k = 1; k < n; k++) {
    out.push(r.freq === 'month' ? nthWeekday(a.getUTCFullYear(), a.getUTCMonth() + k, wdOf(date), r.nth) : addDays(date, 7 * (r.interval || 1) * k));
  }
  return out;
}

      case 1: return `
        <h1 class="q">Про що дзвінок?</h1>
        <div class="field"><input type="text" id="title" class="big-input" maxlength="120" placeholder="Напр., Спільна закупівля" value="${esc(st.title)}"></div>
        <h2 class="q2">Як вас звати?</h2>
        <div class="field"><input type="text" id="org" class="big-input" maxlength="60" placeholder="Ваше ім'я" value="${esc(st.organizer)}"></div>
        <h2 class="q2">Ваша пошта</h2>
        <div class="field"><input type="email" id="orgEmail" class="big-input" maxlength="120" inputmode="email" autocomplete="email" placeholder="you@gmail.com" value="${esc(st.orgEmail)}"></div>
        <p class="small muted" style="margin:-4px 0 0">Надішлемо посилання на результати і повідомимо, коли всі відповідять. Дзвінок з'явиться в «Мої дзвінки».</p>`;
      case 2: return `
        <h1 class="q">Як часто буде дзвінок?</h1>
        <div class="chips list">
          ${chip('how', 'once', '📅 Один раз', st.kind === 'once', 'оберете конкретні дати')}
          ${chip('how', 'w1', '🔁 Щотижня', st.kind === 'repeat' && st.freq === 'w1', 'наприклад, кожен вівторок')}
          ${chip('how', 'w2', '🔁 Раз на 2 тижні', st.kind === 'repeat' && st.freq === 'w2', 'наприклад, вівторок через тиждень')}
          ${chip('how', 'm', '🔁 Раз на місяць', st.kind === 'repeat' && st.freq === 'm', 'наприклад, 4-й вівторок місяця')}
        </div>
        ${st.kind === 'once' ? `
          <h2 class="q2">Які дати підходять?</h2>
          <p class="muted hint">Натисніть на дні в календарі. Можна кілька.</p>
          <div class="cal" id="cal"></div>
          <div class="chips" style="margin-top:12px"><button type="button" class="chip" id="qWork">Наступні 5 робочих днів</button><button type="button" class="chip" id="qClear">Очистити</button></div>
          <p class="small" id="daysSum" style="margin:12px 0 0"></p>` : ''}
        ${st.kind === 'repeat' ? `
          ${st.freq === 'm' ? `
            <h2 class="q2">Який тиждень місяця?</h2>
            <div class="chips">${[1, 2, 3, 4, -1].map(n => chip('nth', n, cap(NTH_TEXT[n]), st.nth === n)).join('')}</div>` : ''}
          <h2 class="q2">У які дні тижня можна?</h2>
          <p class="muted hint">Можна кілька, і ми підберемо день, який підходить усім.</p>
          <div class="chips wd-chips">${[1, 2, 3, 4, 5, 6, 0].map(w => chip('wd', w, WD_SHORT[w], st.wds.has(w))).join('')}</div>
          <p class="small" id="rptSum" style="margin:12px 0 0">${st.wds.size ? '✓ <b>' + esc(cap(repeatText(st.freq === 'm' ? { freq: 'month', nth: st.nth } : { freq: 'week', interval: st.freq === 'w2' ? 2 : 1 }))) + ':</b> ' + esc([...st.wds].sort((a, b) => ((a + 6) % 7) - ((b + 6) % 7)).map(w => WD_FULL[w]).join(' або ')) : ''}</p>` : ''}`;
      case 3: return `
        <h1 class="q">О котрій?</h1>
        <div class="chips">${PART_OPTS.map(o => chip('part', o.id, o.label, st.part === o.id, o.sub)).join('')}</div>
        <div class="row ${st.part === 'custom' ? '' : 'hide'}" id="customHours" style="gap:8px;align-items:center;margin-top:12px">
          <span class="muted">з</span><select id="hf" style="flex:1" aria-label="З якої години">${hourOpts(st.hf)}</select>
          <span class="muted">до</span><select id="ht" style="flex:1" aria-label="До якої години">${hourOpts(st.ht, 1)}</select>
        </div>
        <h2 class="q2">Скільки триватиме?</h2>
        <div class="chips">${DUR_OPTS.map(o => chip('dur', o.v, o.label, st.dur === o.v)).join('')}</div>
        <div class="unit ${st.dur === 'custom' ? '' : 'hide'}" id="durCWrap" style="margin-top:12px;max-width:220px"><input type="number" id="durC" min="15" max="480" step="5" inputmode="numeric" placeholder="напр., 75" value="${esc(st.durC)}"><span>хвилин</span></div>`;
      case 4: return `
        <h1 class="q">Кого запросити?</h1>
        <p class="muted hint">Якщо вказати пошту, ми самі надішлемо людині запрошення${LIVE ? '' : ' (у демо-режимі листи не надсилаються)'}. Можна пропустити.</p>
        <div id="inv"></div>
        <button type="button" class="chip" id="addInv">＋ Ще людина</button>`;
      case 5: return `
        <h1 class="q">До коли чекаємо відповіді?</h1>
        <div class="chips">${DL_OPTS.map(o => dlOk(o.v)
          ? chip('dl', o.v, o.label, st.dl === o.v, o.sub || '')
          : `<button type="button" class="chip" disabled>${esc(o.label)}<small>надто пізно</small></button>`).join('')}</div>
        <div class="${st.dl === 'custom' ? '' : 'hide'}" id="dlCWrap" style="margin-top:12px"><input type="datetime-local" id="dlC" value="${esc(st.dlC || toLocalInput(roundHour(Date.now() + 48 * 3600e3)))}" min="${toLocalInput(Date.now())}"></div>
        <div class="summary" id="summary"></div>`;
    }
  };

  const save = () => {
    if (st.step === 1) { st.title = $('#title').value.trim(); st.organizer = $('#org').value.trim(); st.orgEmail = $('#orgEmail').value.trim(); }
    if (st.step === 3) { if ($('#hf')) { st.hf = +$('#hf').value; st.ht = +$('#ht').value; } if ($('#durC')) st.durC = $('#durC').value; }
    if (st.step === 4) st.invitees = [...$('#inv').querySelectorAll('.inv-row')].map(r => ({ name: r.querySelector('.inv-n').value.trim(), email: r.querySelector('.inv-e').value.trim() }));
    if (st.step === 5 && $('#dlC')) st.dlC = $('#dlC').value;
  };
  const hours = () => st.part === 'custom' ? [st.hf, st.ht] : (o => [o.from, o.to])(PART_OPTS.find(o => o.id === st.part));
  const duration = () => st.dur === 'custom' ? Math.round(Number(st.durC)) : st.dur;
  const repeatObj = () => st.kind !== 'repeat' ? null
    : st.freq === 'm' ? { freq: 'month', interval: 1, nth: st.nth, wds: [...st.wds] }
    : { freq: 'week', interval: st.freq === 'w2' ? 2 : 1, wds: [...st.wds] };
  const lastEnd = () => { const days = [...st.days].sort(); return new Date(days[days.length - 1] + 'T00:00').getTime() + hours()[1] * 3600e3; };
  const presetDl = v => roundHour(Date.now() + v * 3600e3) - 3600e3;
  const dlOk = v => v === 'custom' || st.kind === 'repeat' || presetDl(v) < lastEnd();
  const deadline = () => st.dl === 'custom' ? (st.dlC ? new Date(st.dlC).getTime() : NaN) : presetDl(st.dl);

  const check = () => {
    if (st.step === 1) {
      if (!st.title) return 'Напишіть, про що дзвінок';
      if (!st.organizer) return "Напишіть своє ім'я";
      if (LIVE && !st.orgEmail) return 'Напишіть свою пошту: туди прийде посилання на результати';
      const pe = st.orgEmail && emailProblem(st.orgEmail);
      if (pe) return pe;
    }
    if (st.step === 2) {
      if (!st.kind) return 'Оберіть, як часто буде дзвінок';
      if (st.kind === 'once' && !st.days.size) return 'Натисніть хоча б на один день у календарі';
      if (st.kind === 'repeat' && !st.wds.size) return 'Оберіть хоча б один день тижня';
    }
    if (st.step === 3) {
      const [f, t] = hours(), d = duration();
      if (t <= f) return 'Кінець має бути пізніше за початок';
      if (!Number.isFinite(d) || d < 15 || d > 480) return 'Тривалість — від 15 хвилин до 8 годин';
      if (d > (t - f) * 60) return 'Дзвінок не вміщається в ці години. Оберіть інший час або коротший дзвінок';
    }
    if (st.step === 4) {
      for (const i of st.invitees) { const pe = i.email && emailProblem(i.email); if (pe) return pe; }
    }
    if (st.step === 5) {
      const dl = deadline(), days = [...st.days].sort(), [, t] = hours();
      if (!Number.isFinite(dl) || dl <= Date.now()) return 'Оберіть час у майбутньому';
      if (st.kind === 'repeat') return dl > Date.now() + 30 * 864e5 ? 'Не довше 30 днів' : '';
      const lastEnd = new Date(days[days.length - 1] + 'T00:00').getTime() + t * 3600e3;
      if (dl >= lastEnd) return 'Відповіді треба зібрати раніше, ніж останній обраний день. Оберіть коротший термін';
    }
    return '';
  };

  const render = () => {
    app.innerHTML = `
    <div class="wizard card">
      <div class="progress" aria-label="Крок ${st.step} з ${TOTAL}">${Array.from({ length: TOTAL }, (_, i) => `<span class="${i < st.step ? 'on' : ''}"></span>`).join('')}</div>
      <form id="f" novalidate>
        ${stepHtml()}
        <p class="err" id="err" role="alert"></p>
        <div class="nav">
          ${st.step > 1 ? '<button type="button" class="btn big-btn" id="back">← Назад</button>' : ''}
          <button type="submit" class="btn primary big-btn" id="next">${st.step < TOTAL ? 'Далі →' : '✓ Створити'}</button>
        </div>
        ${st.step === 4 ? '<button type="button" class="linkbtn" id="skip">Пропустити</button>' : ''}
      </form>
    </div>`;
    bind();
    const first = app.querySelector('.big-input');
    if (first && !first.value) first.focus();
  };

  const bind = () => {
    $('#back')?.addEventListener('click', () => { save(); st.step--; render(); });
    $('#skip')?.addEventListener('click', () => { st.invitees = [{ name: '', email: '' }]; st.step++; render(); });
    app.querySelectorAll('.chip[data-g]').forEach(b => b.addEventListener('click', () => {
      save();
      const g = b.dataset.g, raw = b.dataset.v, v = /^-?\d+$/.test(raw) ? +raw : raw;
      if (g === 'wd') { st.wds.has(v) ? st.wds.delete(v) : st.wds.add(v); }
      else if (g === 'how') { if (v === 'once') st.kind = 'once'; else { st.kind = 'repeat'; st.freq = v; } }
      else st[g] = v;
      render();
      if (g === 'dur' && v === 'custom') $('#durC').focus();
    }));
    if (st.step === 2 && st.kind === 'once') bindCal();
    if (st.step === 4) bindInv();
    if (st.step === 5) $('#summary').innerHTML = summaryHtml();
    $('#f').addEventListener('input', () => { $('#err').textContent = ''; });
    $('#f').addEventListener('submit', async e => {
      e.preventDefault();
      save();
      const err = check();
      if (err) { $('#err').textContent = err; return; }
      if (st.step < TOTAL) {
        st.step++;
        if (st.step === 5 && !dlOk(st.dl)) st.dl = [48, 24].find(dlOk) || 'custom';
        render(); window.scrollTo(0, 0); return;
      }
      await submit();
    });
  };

  const bindCal = () => {
    const drawCal = () => {
      const first = dObj(st.month);
      const y = first.getUTCFullYear(), mo = first.getUTCMonth();
      const lead = (first.getUTCDay() + 6) % 7;
      const daysIn = new Date(Date.UTC(y, mo + 1, 0)).getUTCDate();
      const maxDay = addDays(today, 90);
      const canPrev = st.month > today.slice(0, 8) + '01';
      let h = `<div class="cal-head">
        <button type="button" class="btn sm" data-m="-1" ${canPrev ? '' : 'disabled'} aria-label="Попередній місяць">‹</button>
        <b>${MONTHS_NOM[mo]} ${y}</b>
        <button type="button" class="btn sm" data-m="1" aria-label="Наступний місяць">›</button></div>
        <div class="cal-grid">${['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Нд'].map(w => `<span class="cal-w">${w}</span>`).join('')}`;
      for (let i = 0; i < lead; i++) h += '<span></span>';
      for (let n = 1; n <= daysIn; n++) {
        const d = `${y}-${pad(mo + 1)}-${pad(n)}`;
        const off = d < today || d > maxDay;
        const wd = dObj(d).getUTCDay();
        h += `<button type="button" class="cal-d${st.days.has(d) ? ' on' : ''}${wd === 0 || wd === 6 ? ' we' : ''}${d === today ? ' today' : ''}" data-d="${d}" ${off ? 'disabled' : ''} aria-pressed="${st.days.has(d)}">${n}</button>`;
      }
      $('#cal').innerHTML = h + '</div>';
      const list = [...st.days].sort();
      $('#daysSum').innerHTML = list.length
        ? `✓ <b>${plural(list.length, 'день', 'дні', 'днів')}:</b> <span class="muted">${list.map(d => esc(fmtDay(d).replace(',', ''))).join(' · ')}</span>`
        : '';
    };
    $('#cal').addEventListener('click', e => {
      const m = e.target.closest('[data-m]');
      if (m) { const d = dObj(st.month); d.setUTCMonth(d.getUTCMonth() + +m.dataset.m); st.month = isoDate(d).slice(0, 8) + '01'; drawCal(); return; }
      const b = e.target.closest('[data-d]');
      if (!b || b.disabled) return;
      const d = b.dataset.d;
      if (st.days.has(d)) st.days.delete(d);
      else if (st.days.size >= MAX_DAYS) { toast(`Можна обрати до ${MAX_DAYS} днів`); return; }
      else st.days.add(d);
      $('#err').textContent = '';
      drawCal();
    });
    $('#qWork').addEventListener('click', () => {
      let d = today, added = 0;
      while (added < 5 && st.days.size < MAX_DAYS) {
        d = addDays(d, 1);
        const wd = dObj(d).getUTCDay();
        if (wd !== 0 && wd !== 6) { st.days.add(d); added++; }
      }
      st.month = [...st.days].sort()[0].slice(0, 8) + '01';
      $('#err').textContent = '';
      drawCal();
    });
    $('#qClear').addEventListener('click', () => { st.days.clear(); drawCal(); });
    drawCal();
  };

  const bindInv = () => {
    const addRow = (name = '', email = '') => {
      const r = document.createElement('div');
      r.className = 'inv-row';
      r.innerHTML = `<input type="text" class="inv-n" maxlength="60" placeholder="Ім'я" aria-label="Ім'я" value="${esc(name)}">
        <input type="email" class="inv-e" maxlength="120" placeholder="Пошта" aria-label="Пошта" value="${esc(email)}" inputmode="email" autocomplete="off">
        <button type="button" class="btn sm inv-x" aria-label="Прибрати">✕</button>`;
      r.querySelector('.inv-x').addEventListener('click', () => { r.remove(); if (!$('#inv').children.length) addRow(); });
      $('#inv').appendChild(r);
      return r;
    };
    (st.invitees.length ? st.invitees : [{}]).forEach(i => addRow(i.name, i.email));
    $('#addInv').addEventListener('click', () => {
      if ($('#inv').children.length >= 30) { toast('До 30 людей'); return; }
      addRow().querySelector('.inv-n').focus();
    });
  };

  const summaryHtml = () => {
    const [f, t] = hours(), days = [...st.days].sort();
    const people = st.invitees.filter(i => i.name || i.email);
    return `<div class="sum-title">Перевірте:</div>
      <div>📞 <b>${esc(st.title)}</b></div>
      <div>${st.kind === 'repeat'
        ? '🔁 ' + esc(cap(repeatText(repeatObj())) + ': ' + [...st.wds].sort((a, b) => ((a + 6) % 7) - ((b + 6) % 7)).map(w => WD_FULL[w]).join(' або '))
        : '🗓 ' + days.map(d => esc(fmtDay(d).replace(',', ''))).join(' · ')}</div>
      <div>🕘 ${pad(f)}:00–${pad(t)}:00 · ${duration()} хв</div>
      <div>👥 ${people.length ? esc(people.map(i => i.name || i.email.split('@')[0]).join(', ')) : 'надішлете посилання самі'}</div>`;
  };

  const submit = async () => {
    const [f, t] = hours(), r = repeatObj();
    let days = [...st.days].sort();
    if (r) {
      // перше повторення кожного дня тижня — після завершення голосування
      const dl = new Date(deadline());
      const after = `${dl.getFullYear()}-${pad(dl.getMonth() + 1)}-${pad(dl.getDate())}`;
      days = [...new Set(r.wds.map(w => firstOccurrence(r, w, after)))].sort();
    }
    const invitees = st.invitees.filter(i => i.name || i.email).map(i => ({ name: i.name || i.email.split('@')[0], email: i.email }));
    const data = {
      title: st.title, organizer: st.organizer, organizerEmail: st.orgEmail, duration: duration(), days, dateFrom: days[0], dateTo: days[days.length - 1],
      hourFrom: f, hourTo: t, deadline: deadline(), tz: TZ, invitees, expected: invitees.map(i => i.name), repeat: r,
      siteUrl: location.href.split(/[?#]/)[0]
    };
    const btn = $('#next');
    btn.disabled = true; btn.textContent = invitees.some(i => i.email) && LIVE ? 'Надсилаємо запрошення…' : 'Створюємо…';
    try {
      const res = await Store.createPoll(data);
      safeLS.set('cp_admin_' + res.id, res.adminToken);
      safeLS.set('cp_name', st.organizer);
      if (st.orgEmail) safeLS.set('cp_email', st.orgEmail);
      rememberMine({ id: res.id, adminToken: res.adminToken, title: st.title, createdAt: Date.now() });
      viewCreate.st = null;
      justCreated = { ...res, hadEmails: invitees.some(i => i.email) };
      Nav.go({ a: res.id, t: res.adminToken });
    } catch (ex) { $('#err').textContent = ex.message; btn.disabled = false; btn.textContent = '✓ Створити'; }
  };

  render();
}
function hourOpts(sel, shift = 0) { let s = ''; for (let h = 0 + shift; h <= 23 + shift; h++) s += `<option value="${h}"${h === sel ? ' selected' : ''}>${pad(h)}:00</option>`; return s; }

function finalCard(poll, forAdmin) {
  const f = poll.final;
  const start = f.start, d = f.date;
  const g = gcalLink(poll, d, start);
  return `<div class="card final">
    <div class="emoji">🎉</div>
    <div class="muted">Дзвінок призначено</div>
    <div class="big">${esc(slotTitle(poll, d))}<br>${hm(start)}–${hm(start + poll.duration)}</div>
    ${slotFirst(poll, d)}
    <p class="muted">${esc(poll.title)} · час за Києвом</p>
    ${f.link ? `<p><a href="${esc(f.link)}" target="_blank" rel="noopener">${esc(f.link)}</a></p>` : ''}
    <div class="stack">
      <a class="btn primary big-btn" href="${esc(g)}" target="_blank" rel="noopener">📅 Додати в мій календар</a>
      ${forAdmin ? `<a class="btn wa big-btn" href="${esc(waLink(finalText(poll)))}" target="_blank" rel="noopener">Повідомити в WhatsApp</a>
      <button class="linkbtn" id="unfinal">Обрати інший час</button>` : ''}
    </div>
  </div>`;
}
function gcalLink(poll, d, start) {
  const ymd = d.replace(/-/g, '');
  const t = m => `${pad(Math.floor(m / 60))}${pad(m % 60)}00`;
  const details = (poll.final?.link ? 'Посилання: ' + poll.final.link + '\n\n' : '') + 'Створено через «Спільний час»';
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE'
    + '&text=' + encodeURIComponent(poll.title)
    + '&dates=' + ymd + 'T' + t(start) + '/' + ymd + 'T' + t(start + poll.duration)
    + '&ctz=' + encodeURIComponent(poll.tz || TZ)
    + (poll.repeat ? '&recur=' + encodeURIComponent('RRULE:' + (poll.repeat.freq === 'month'
        ? 'FREQ=MONTHLY;BYDAY=' + poll.repeat.nth + WD_RRULE[wdOf(d)]
        : 'FREQ=WEEKLY;INTERVAL=' + (poll.repeat.interval || 1) + ';BYDAY=' + WD_RRULE[wdOf(d)])) : '')
    + '&details=' + encodeURIComponent(details);
}
function finalText(poll) {
  const f = poll.final;
  return `📞 Дзвінок «${poll.title}» призначено!\n🗓 ${slotTitle(poll, f.date)}, ${hm(f.start)}–${hm(f.start + poll.duration)} (за Києвом)`
    + (poll.repeat ? `\nПерший дзвінок — ${fmtDayLong(f.date)}` : '')
    + (f.link ? `\n🔗 ${f.link}` : '') + `\n\nДодати в календар: ${gcalLink(poll, f.date, f.start)}`;
}
const whenText = poll => (poll.repeat ? '🔁 ' + repeatText(poll.repeat) + ' · ' : '') + `${poll.duration} хв · ${pad(poll.hourFrom)}:00–${pad(poll.hourTo)}:00`;

/* ======================= УЧАСНИК ======================= */
async function viewParticipant(id) {
  const { poll, responses } = await Store.getPoll(id);
  const meId = safeLS.get('cp_me_' + id);
  const me = responses.find(r => r.id === meId);
  const closed = isClosed(poll);
  const adminTok = safeLS.get('cp_admin_' + id);
  const invited = (poll.invites || []).find(x => x.id === Nav.params.i);
  const adminLink = adminTok ? `<p class="center small" style="margin-top:16px"><a ${navAttrs({ a: id, t: adminTok })}>→ Відкрити панель організатора</a></p>` : '';

  const intro = `<div class="card hero">
    <div class="muted">${esc(poll.organizer)} запрошує на дзвінок</div>
    <h1>${esc(poll.title)}</h1>
    <div class="muted small">${esc(whenText(poll))}</div>
  </div>`;

  if (poll.final) { app.innerHTML = intro + finalCard(poll, false) + adminLink; return; }
  if (closed) {
    app.innerHTML = intro + `<div class="card center"><div class="emoji">⏳</div><h2>Голосування завершено</h2><p class="muted">Організатор скоро обере час.</p></div>` + adminLink;
    return;
  }

  const st = viewParticipant.st && viewParticipant.st.id === id ? viewParticipant.st : (viewParticipant.st = {
    id, step: me ? 'done' : 'name', name: me?.name || invited?.name || safeLS.get('cp_name') || '',
    selected: new Set(me ? me.cells : []), busy: null, source: me?.source || 'manual'
  });

  const render = () => {
    if (st.step === 'name') {
      app.innerHTML = intro + `<div class="card">
        <h2 class="q">Як вас звати?</h2>
        <form id="f" novalidate>
          <input type="text" id="nm" class="big-input" maxlength="60" placeholder="Ваше ім'я" value="${esc(st.name)}">
          <p class="err" id="err"></p>
          <button class="btn primary big-btn block" type="submit">Далі →</button>
        </form></div>` + adminLink;
      $('#nm').focus();
      $('#f').addEventListener('submit', e => {
        e.preventDefault();
        st.name = $('#nm').value.trim();
        if (!st.name) { $('#err').textContent = "Напишіть своє ім'я"; return; }
        st.step = (LIVE && !HAS_GCAL) ? 'pick' : 'how'; st.source = 'manual'; render();
      });
      return;
    }
    if (st.step === 'how') {
      app.innerHTML = intro + `<div class="card">
        <h2 class="q">${esc(st.name)}, коли вам зручно?</h2>
        <div class="stack">
          <button class="btn primary big-btn" id="gcal">📅 Взяти з мого Google Calendar</button>
          <p class="small muted center" style="margin:-4px 0 6px">${HAS_GCAL ? 'Ми бачимо лише «зайнято / вільно», без назв подій.' : 'Демо: зайнятість буде вигадана.'}</p>
          <button class="btn big-btn" id="manual">✋ Відмічу сам(а)</button>
        </div>
        <button class="linkbtn" id="rename">Я не ${esc(st.name)}</button>
      </div>` + adminLink;
      $('#rename').addEventListener('click', () => { st.step = 'name'; render(); });
      $('#manual').addEventListener('click', () => { st.source = 'manual'; st.step = 'pick'; render(); });
      $('#gcal').addEventListener('click', () => {
        if (!HAS_GCAL) { applyBusy(fakeBusy(poll, st.name)); return; }
        const btn = $('#gcal');
        let req;
        try { req = GCal.request(); } catch (ex) { toast(ex.message); return; }
        btn.disabled = true; btn.textContent = 'Підключаємо…';
        req.then(token => GCal.busyCells(token, poll)).then(applyBusy)
          .catch(ex => { toast(ex.message); btn.disabled = false; btn.textContent = '📅 Взяти з мого Google Calendar'; });
      });
      if (HAS_GCAL) GCal.load().catch(() => {});
      return;
    }
    if (st.step === 'pick') {
      app.innerHTML = intro + `<div class="card">
        ${st.busy ? '<div class="banner ok">✓ Готово! Синє — коли ви вільні. Перевірте й натисніть «Готово».</div>' : ''}
        <h2 class="q">${poll.repeat ? 'Коли вам зазвичай зручно?' : 'Натисніть, коли вам зручно'}</h2>
        <p class="small muted hint">Синє — зручно. Натисніть ще раз, щоб прибрати.</p>
        <div class="grid-wrap" id="grid"></div>
        <div class="legend"><span><i style="background:var(--sel)"></i>зручно</span>${st.busy ? '<span><i style="background:repeating-linear-gradient(135deg,var(--busy) 0 3px,transparent 3px 6px)"></i>зайнято в календарі</span>' : ''}</div>
      </div>
      <div class="bottom-bar"><button class="btn primary big-btn block" id="save">✓ Готово</button></div>`;
      renderGrid($('#grid'), poll, { mode: 'edit', selected: st.selected, busy: st.busy, onChange() {} });
      $('#save').addEventListener('click', async () => {
        if (!st.selected.size && !armed($('#save'), 'Нічого не вибрано. Натисніть ще раз, якщо вам ніколи не зручно')) return;
        const btn = $('#save');
        btn.disabled = true; btn.textContent = 'Зберігаємо…';
        try {
          const { id: rid } = await Store.saveResponse(id, { id: safeLS.get('cp_me_' + id), name: st.name, cells: [...st.selected], source: st.source });
          safeLS.set('cp_me_' + id, rid);
          safeLS.set('cp_name', st.name);
          st.step = 'done'; render(); window.scrollTo(0, 0);
        } catch (ex) { toast(ex.message); btn.disabled = false; btn.textContent = '✓ Готово'; }
      });
      return;
    }
    // done
    app.innerHTML = intro + `<div class="card center">
      <div class="emoji">✅</div>
      <h2>Дякуємо, ${esc(st.name)}!</h2>
      <p class="muted">Ваш час збережено. Коли організатор обере час, ви побачите його за цим самим посиланням${invited ? ' і отримаєте лист' : ''}.</p>
      <button class="btn big-btn" id="edit">Змінити відповідь</button>
    </div>` + adminLink;
    $('#edit').addEventListener('click', () => { st.step = 'pick'; render(); });
  };

  const applyBusy = busySet => {
    st.busy = busySet;
    st.selected = new Set();
    for (const d of pollDays(poll)) for (const m of pollTimes(poll)) { const k = cellKey(d, m); if (!busySet.has(k)) st.selected.add(k); }
    st.source = 'google';
    st.step = 'pick';
    render();
  };

  render();
}

/* ======================= ОРГАНІЗАТОР: результати ======================= */
function createdBanner(res) {
  const n = res.mailed || 0, failed = res.mailFailed || [];
  return `<div class="banner ok">🎉 Готово! ${n ? `Запрошення надіслано ${plural(n, 'людині', 'людям', 'людям')}.` : 'Тепер надішліть посилання людям.'}${res.orgMailed ? ' Посилання на цю сторінку ми надіслали вам на пошту.' : ''}</div>`
    + (failed.length ? `<div class="banner">Не вдалося надіслати лист на: ${esc(failed.join(', '))}. Надішліть їм посилання самі.</div>` : '')
    + (res.demo && res.hadEmails ? '<div class="banner">Демо-режим: листи не надсилаються.</div>' : '');
}
async function viewAdmin(id, token, isNew) {
  const adm = await Store.checkAdmin(id, token).catch(() => null);
  if (!adm) { app.innerHTML = `<div class="card center"><div class="emoji">🔒</div><h1>Немає доступу</h1><p class="muted">Це посилання організатора неправильне.</p><a class="btn big-btn" ${navAttrs({ p: id })}>Відкрити як учасник</a></div>`; return; }
  safeLS.set('cp_admin_' + id, token);
  const { poll, responses } = await Store.getPoll(id);
  const closed = isClosed(poll);
  const pLink = Nav.link({ p: id });
  const aLink = Nav.link({ a: id, t: token });
  const missing = missingPeople(poll, responses);
  const slots = rankSlots(poll, responses);
  const withEmail = new Set((adm.emailNames || []).map(norm));
  const missingMail = missing.filter(n => withEmail.has(norm(n)));
  const expectedTotal = responses.length + missing.length;
  const inviteText = `Привіт! 👋 Плануємо дзвінок «${poll.title}». Відмітьте, будь ласка, коли вам зручно (1 хвилина) до ${fmtDeadline(poll.deadline)}:\n${pLink}`;
  const remindText = `Нагадування 🙂 ${missing.length ? missing.join(', ') + ', в' : 'В'}ідмітьте, будь ласка, зручний час для дзвінка «${poll.title}» до ${fmtDeadline(poll.deadline)}:\n${pLink}`;
  const total = responses.length;
  const best = slots[0];

  const status = poll.final ? '' : closed
    ? '<span class="pill">Голосування завершено</span>'
    : `<span class="pill warn">⏳ ще <span class="countdown" data-countdown></span></span>`;

  const bestCard = poll.final ? finalCard(poll, true) : best ? `
    <div class="card best">
      <div class="muted">${closed ? 'Найкращий час' : 'Поки що найкращий час'}</div>
      <div class="big">${esc(slotTitle(poll, best.date))}<br>${hm(best.start)}–${hm(best.end)}</div>
      ${slotFirst(poll, best.date)}
      <div class="who">${best.yes.length === total ? `✓ Можуть усі ${total}` : `Можуть ${best.yes.length} з ${total}`}${best.no.length ? `<div class="small muted">не можуть: ${esc(best.no.join(', '))}</div>` : ''}</div>
      <button class="btn primary big-btn block" data-pick="0">✓ Обрати цей час</button>
      ${!closed && missing.length ? `<p class="small muted center" style="margin:8px 0 0">Ще не відповіли ${missing.length}. Можна обрати зараз або почекати.</p>` : ''}
    </div>` : `
    <div class="card center">
      <div class="emoji">⏳</div>
      <h2>${total ? 'Спільного часу поки немає' : 'Чекаємо на відповіді'}</h2>
      <p class="muted">${total ? 'Ніхто не обрав час, у який вміщається весь дзвінок. Нагадайте іншим або створіть дзвінок з іншими днями.' : 'Щойно люди відмітять час, тут з\'явиться найкращий варіант.'}</p>
    </div>`;

  const others = !poll.final && slots.length > 1 ? `
    <details class="card">
      <summary>Інші варіанти (${slots.length - 1})</summary>
      ${slots.slice(1).map((s, i) => `<div class="slot"><div class="body"><b>${esc(slotTitle(poll, s.date))}, ${hm(s.start)}–${hm(s.end)}</b>
        <div class="small muted">можуть ${s.yes.length} з ${total}${s.no.length ? ` · не можуть: ${esc(s.no.join(', '))}` : ''}</div></div>
        <button class="btn sm" data-pick="${i + 1}">Обрати</button></div>`).join('')}
    </details>` : '';

  app.innerHTML = `
  ${isNew ? createdBanner(isNew) : ''}
  <div class="card hero">
    <div class="muted">Ваш дзвінок</div>
    <h1>${esc(poll.title)}</h1>
    <div class="meta">${status}<span class="pill">Відповіли ${total}${expectedTotal > total ? ' з ' + expectedTotal : ''}</span></div>
  </div>
  ${bestCard}
  ${poll.final ? '' : `<div class="card">
    <h2>Люди</h2>
    <div class="people">
      ${responses.map(r => `<span class="pill ok">✓ ${esc(r.name)}${r.source === 'google' ? ' 📅' : ''}</span>`).join('')}
      ${missing.map(n => `<span class="pill">⏳ ${esc(n)}</span>`).join('')}
      ${!responses.length && !missing.length ? '<span class="muted small">Поки нікого</span>' : ''}
    </div>
    ${closed ? '' : `<div class="stack" style="margin-top:14px">
      <a class="btn wa big-btn" href="${esc(waLink(missing.length && total ? remindText : inviteText))}" target="_blank" rel="noopener">${missing.length && total ? `🔔 Нагадати у WhatsApp` : '📤 Надіслати посилання у WhatsApp'}</a>
      ${LIVE && missingMail.length ? `<button class="btn big-btn" id="remindMail">✉ Нагадати поштою (${missingMail.length})</button>` : ''}
      <div class="copy"><input type="text" readonly value="${esc(pLink)}" aria-label="Посилання для учасників"><button class="btn" id="cpP">Копіювати</button></div>
    </div>`}
  </div>`}
  ${others}
  <details class="card">
    <summary>Більше</summary>
    ${!poll.final && slots.length ? `<div class="field" style="margin-top:12px"><label for="meet">Посилання на дзвінок (Meet / Zoom), якщо вже є</label><input type="url" id="meet" placeholder="https://meet.google.com/..."></div>` : ''}
    <h3>Коли зручно всім</h3>
    <div class="grid-wrap" id="grid"></div>
    <div class="legend"><span><i style="background:rgba(var(--heat-rgb),.25)"></i>мало кому</span><span><i style="background:rgba(var(--heat-rgb),1)"></i>усім</span></div>
    <h3>Ваше посилання організатора</h3>
    <p class="small muted">Збережіть його: лише за ним можна обрати час.</p>
    <div class="copy"><input type="text" readonly value="${esc(aLink)}" aria-label="Посилання організатора"><button class="btn" id="cpA">Копіювати</button></div>
    <div class="actions" style="margin-top:14px">
      <a class="btn sm" ${navAttrs({ p: id })}>Відмітити свій час</a>
      ${!closed && !poll.final ? '<button class="btn sm" id="closeNow">Завершити голосування</button>' : ''}
      ${!poll.final ? '<button class="btn sm" id="demo" title="Додає вигаданих людей, щоб подивитися, як це працює">+ Тестові учасники</button>' : ''}
    </div>
  </details>`;

  renderGrid($('#grid'), poll, { mode: 'heat', responses, highlight: poll.final ? { date: poll.final.date, start: poll.final.start, end: poll.final.start + poll.duration } : best });
  if (!closed && !poll.final) startTicker(poll.deadline, () => route());

  $('#cpP')?.addEventListener('click', () => copyText(pLink, $('#cpP').previousElementSibling));
  $('#cpA')?.addEventListener('click', () => copyText(aLink, $('#cpA').previousElementSibling));
  $('#remindMail')?.addEventListener('click', e => {
    if (!armed(e.currentTarget, `Надіслати лист ${missingMail.length}? Натисніть ще раз`)) return;
    busy(e.currentTarget, async () => {
      const r = await Store.adminAction(id, token, 'remind');
      const f = r.mailFailed || [];
      toast((r.mailed ? `Надіслано: ${r.mailed}` : 'Жодного листа не надіслано') + (f.length ? `. Не вдалося: ${f.join(', ')}` : ''));
    });
  });
  $('#closeNow')?.addEventListener('click', e => {
    if (!armed(e.currentTarget, 'Точно? Натисніть ще раз')) return;
    busy(e.currentTarget, async () => { await Store.adminAction(id, token, 'close'); route(); });
  });
  $('#unfinal')?.addEventListener('click', e => busy(e.currentTarget, async () => { await Store.adminAction(id, token, 'finalize', { final: null }); route(); }));
  app.querySelectorAll('[data-pick]').forEach(b => b.addEventListener('click', () => {
    const s = slots[+b.dataset.pick];
    const link = ($('#meet')?.value || '').trim();
    if (link && !/^https?:\/\//i.test(link)) { toast('Посилання має починатися з https://'); return; }
    busy(b, async () => {
      await Store.adminAction(id, token, 'finalize', { final: { date: s.date, start: s.start, link } });
      toast('Час обрано!');
      route();
    });
  }));
  $('#demo')?.addEventListener('click', e => busy(e.currentTarget, async () => {
    const pool = ['Олена', 'Андрій', 'Марта', 'Ігор', 'Світлана', 'Богдан', 'Наталія', 'Тарас'];
    const taken = new Set(responses.map(r => norm(r.name)));
    const names = [...missing, ...pool].filter((n, i, a) => !taken.has(norm(n)) && a.findIndex(x => norm(x) === norm(n)) === i).slice(0, 4);
    for (const n of names) {
      const bz = fakeBusy(poll, n), cells = [];
      const r = rng(hashStr(n));
      for (const d of pollDays(poll)) for (const m of pollTimes(poll)) { const k = cellKey(d, m); if (!bz.has(k) && r() > 0.25) cells.push(k); }
      await Store.saveResponse(id, { name: n, cells, source: 'google' });
    }
    toast('Додано тестових людей: ' + names.length);
    route();
  }));
}

/* ======================= МОЇ ДЗВІНКИ ======================= */
function rememberMine(x) {
  let list = [];
  try { list = JSON.parse(safeLS.get('cp_mine') || '[]'); } catch {}
  list = [x, ...list.filter(y => y.id !== x.id)].slice(0, 50);
  safeLS.set('cp_mine', JSON.stringify(list));
}
function localMine() { try { return JSON.parse(safeLS.get('cp_mine') || '[]'); } catch { return []; } }
function pollStatus(x) {
  if (x.final) return `✓ ${esc(x.repeat ? cap(repeatText(x.repeat, wdOf(x.final.date))) : fmtDay(x.final.date))}, ${hm(x.final.start)}`;
  if (x.closed) return '⏳ голосування завершено, оберіть час';
  return `відповіли ${x.answered}${x.expected ? ' з ' + x.expected : ''} · до ${esc(fmtDeadline(x.deadline))}`;
}
async function viewMy() {
  const session = safeLS.get('cp_session');
  const newBtn = `<a class="btn primary big-btn block" ${navAttrs({})}>＋ Новий дзвінок</a>`;
  if (LIVE && session) {
    let data;
    try { data = await Store.myPolls(session); }
    catch (ex) { safeLS.set('cp_session', ''); return viewMy(); }
    app.innerHTML = `<div class="card">
        <h1 class="q" style="margin-bottom:4px">Мої дзвінки</h1>
        <p class="muted small" style="margin:0">${esc(data.email)} · <button class="linkbtn" id="logout" style="display:inline;margin:0">Вийти</button></p>
      </div>
      ${data.polls.length ? data.polls.map(x => `<a class="card poll-item" ${navAttrs({ a: x.id, t: x.adminToken })}>
          <b>${esc(x.title)}</b><span class="small muted">${pollStatus(x)}</span></a>`).join('')
        : '<div class="card center"><div class="emoji">📭</div><p class="muted">Поки немає дзвінків. Створіть перший!</p></div>'}
      ${newBtn}`;
    $('#logout').addEventListener('click', () => { safeLS.set('cp_session', ''); route(); });
    return;
  }
  const mine = localMine();
  app.innerHTML = `${LIVE ? `<div class="card">
      <h1 class="q">Мої дзвінки</h1>
      <p class="muted hint">Напишіть свою пошту, і ми надішлемо посилання для входу. Без пароля. Так ви побачите свої дзвінки з будь-якого телефона чи комп'ютера.</p>
      <form id="lf" novalidate>
        <input type="email" id="le" class="big-input" maxlength="120" inputmode="email" autocomplete="email" placeholder="you@gmail.com" value="${esc(safeLS.get('cp_email') || '')}">
        <p class="err" id="err"></p>
        <button class="btn primary big-btn block" type="submit">Надіслати посилання для входу</button>
      </form>
    </div>` : ''}
    ${mine.length ? `<div class="card"><h2>На цьому пристрої</h2>${mine.map(x => `<a class="poll-row" ${navAttrs({ a: x.id, t: x.adminToken })}><b>${esc(x.title)}</b><span class="small muted">${esc(fmtDeadline(x.createdAt))}</span></a>`).join('')}</div>` : ''}
    ${newBtn}`;
  $('#lf')?.addEventListener('submit', async e => {
    e.preventDefault();
    const email = $('#le').value.trim();
    const pe = emailProblem(email);
    if (pe) { $('#err').textContent = pe; return; }
    const btn = $('#lf button'); btn.disabled = true; btn.textContent = 'Надсилаємо…';
    try {
      await Store.login(email);
      safeLS.set('cp_email', email);
      $('#lf').outerHTML = `<div class="center"><div class="emoji">📬</div><h2>Перевірте пошту</h2><p class="muted">Ми надіслали посилання для входу на <b>${esc(email)}</b>. Воно діє 30 хвилин. Якщо листа немає, загляньте в «Спам».</p></div>`;
    } catch (ex) { $('#err').textContent = ex.message; btn.disabled = false; btn.textContent = 'Надіслати посилання для входу'; }
  });
}
async function viewLogin(token) {
  try {
    const r = await Store.session(token);
    safeLS.set('cp_session', r.session);
    safeLS.set('cp_email', r.email);
    history.replaceState(null, '', location.pathname + '?my=1');
    Nav.params = { my: '1' };
    toast('Ви увійшли');
    await viewMy();
  } catch (ex) {
    app.innerHTML = `<div class="card center"><div class="emoji">⌛</div><h2>Посилання не спрацювало</h2><p class="muted">${esc(ex.message)}</p><a class="btn primary big-btn" ${navAttrs({ my: '1' })}>Увійти ще раз</a></div>`;
  }
}

let justCreated = false;
async function route() {
  clearInterval(tickTimer);
  const P = Nav.params;
  const isPage = !!(P.p || (P.a && P.t) || P.my || P.login);
  if (isPage && !app.querySelector('.card')) app.innerHTML = '<div class="card muted">Завантаження…</div>';
  app.style.opacity = isPage ? '.55' : '';
  const fresh = justCreated; justCreated = false;
  try {
    if (P.login) await viewLogin(P.login);
    else if (P.my) await viewMy();
    else if (P.p) await viewParticipant(P.p);
    else if (P.a && P.t) await viewAdmin(P.a, P.t, fresh);
    else viewCreate();
  } catch (ex) {
    app.innerHTML = `<div class="card"><h1>Упс</h1><p class="muted">${esc(ex.message)}</p><a class="btn" ${navAttrs({})}>Створити новий дзвінок</a></div>`;
  } finally {
    app.style.opacity = '';
  }
}

(async () => {
  await Store.init();
  const b = $('#modeBadge');
  if (Store.mode === 'local') { b.textContent = 'Демо-режим'; b.title = 'Дані зберігаються лише в цьому браузері.'; b.classList.remove('hide'); }
  else document.querySelector('#ftText').textContent = 'Спільний час';
  Nav.init();
  route();
})();
</script>
